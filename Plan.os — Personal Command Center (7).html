    /**
     * ============================================================================
     * STATE MUTATIONS & EVENT HANDLERS (WITH SMOOTH EXIT & TARGETED UPDATES)
     * ============================================================================
     */
    let closeModalTimer = null;

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (!root || !root.innerHTML.trim()) return;
      const backdrop = root.querySelector('.modal-backdrop');
      const sheet = root.querySelector('.modal-sheet');
      if (backdrop && sheet) {
        backdrop.classList.remove('animate-ios-backdrop');
        backdrop.classList.add('animate-ios-backdrop-exit');
        sheet.classList.remove('animate-ios-sheet');
        sheet.classList.add('animate-ios-sheet-exit');
        clearTimeout(closeModalTimer);
        closeModalTimer = setTimeout(() => {
          root.innerHTML = '';
        }, 155);
      } else {
        root.innerHTML = '';
      }
    }

    function toggleTaskDone(taskId, e) {
      if (e) e.stopPropagation();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.completed = !task.completed;
      state.justToggledTaskId = taskId;
      renderApp(false);
      state.justToggledTaskId = null;
      markDataChanged();
      showToast(task.completed ? 'Tugas selesai' : 'Tugas dikembalikan ke aktif');
    }

    function toggleSubtaskDone(taskId, subId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const sub = task.subtasks.find(s => s.id === subId);
      if (sub) sub.done = !sub.done;
      openTaskDetailModal(taskId, true);
      renderApp(false);
      markDataChanged();
    }

    function deleteSubtask(taskId, subId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.subtasks = task.subtasks.filter(s => s.id !== subId);
      openTaskDetailModal(taskId, true);
      renderApp(false);
      markDataChanged();
    }

    function addSubtask(e, taskId) {
      e.preventDefault();
      const input = document.getElementById('new-subtask-input');
      const val = input.value.trim();
      if (!val) return;
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.subtasks.push({ id: generateId('sub'), text: val, done: false });
      openTaskDetailModal(taskId, true);
      renderApp(false);
      markDataChanged();
    }

    function deleteTaskById(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      closeModal();
      renderApp(false);
      markDataChanged();
      showToast('Tugas dihapus');
    }

    function deleteScheduleById(schId) {
      state.schedules = state.schedules.filter(s => s.id !== schId);
      const gridEl = document.getElementById('calendar-days-grid');
      if (gridEl) gridEl.innerHTML = renderCalendarGridDays();
      const timelinePanel = document.getElementById('calendar-timeline-panel');
      if (timelinePanel) {
        timelinePanel.innerHTML = renderCalendarTimelineInner(true);
      } else {
        renderApp(false);
      }
      markDataChanged();
      showToast('Jadwal dihapus');
    }

    function submitQuickTask(e) {
      e.preventDefault();
      const title = document.getElementById('qa-task-title').value.trim();
      if (!title) return;
      const subRaw = document.getElementById('qa-task-sub').value.trim();
      const subtasks = subRaw
        ? subRaw.split(',').map(s => s.trim()).filter(Boolean).map(text => ({ id: generateId('s'), text, done: false }))
        : [];

      state.tasks.unshift({
        id: generateId('t'),
        title,
        category: document.getElementById('qa-task-cat').value,
        priority: document.getElementById('qa-task-prio').value,
        deadlineDate: document.getElementById('qa-task-date').value,
        deadlineTime: document.getElementById('qa-task-time').value,
        reminder: '1 jam sebelum',
        notes: document.getElementById('qa-task-notes').value.trim(),
        completed: false,
        subtasks
      });

      closeModal();
      renderApp(false);
      markDataChanged();
      showToast('Tugas ditambahkan');
    }

    function submitQuickSchedule(e) {
      e.preventDefault();
      const title = document.getElementById('qa-sch-title').value.trim();
      if (!title) return;
      const date = document.getElementById('qa-sch-date').value;

      state.schedules.push({
        id: generateId('sch'),
        title,
        category: document.getElementById('qa-sch-cat').value,
        date,
        startTime: document.getElementById('qa-sch-start').value,
        endTime: document.getElementById('qa-sch-end').value,
        location: document.getElementById('qa-sch-loc').value.trim() || 'Terjadwal',
        recurringWeekly: document.getElementById('qa-sch-recurring').checked
      });

      state.selectedCalendarDate = date;
      const parts = date.split('-').map(Number);
      if (parts.length === 3) {
        state.calendarYear = parts[0];
        state.calendarMonth = parts[1] - 1;
      }
      closeModal();
      renderApp(false);
      markDataChanged();
      showToast('Jadwal disimpan');
    }

    function submitQuickLesson(e) {
      e.preventDefault();
      const name = document.getElementById('qa-les-name').value.trim();
      const chapterTitle = document.getElementById('qa-les-chapter').value.trim();
      if (!name || !chapterTitle) return;

      const existing = state.subjects.find(s => s.name.toLowerCase() === name.toLowerCase());
      const newChapter = {
        id: generateId('ch'),
        title: chapterTitle,
        status: 'belum',
        note: document.getElementById('qa-les-note').value.trim()
      };

      if (existing) {
        existing.chapters.push(newChapter);
      } else {
        state.subjects.push({
          id: generateId('sub'),
          name,
          teacher: document.getElementById('qa-les-teacher').value.trim() || 'Mata Pelajaran',
          iconKey: document.getElementById('qa-les-icon').value,
          chapters: [newChapter]
        });
      }

      closeModal();
      renderApp(false);
      markDataChanged();
      showToast('Materi ditambahkan');
    }

    function setChapterStatus(subId, chapId, status) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const ch = sub.chapters.find(c => c.id === chapId);
      if (ch) ch.status = status;
      openSubjectDetailModal(subId, true);
      renderApp(false);
      markDataChanged();
    }

    function deleteChapter(subId, chapId) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      sub.chapters = sub.chapters.filter(c => c.id !== chapId);
      openSubjectDetailModal(subId, true);
      renderApp(false);
      markDataChanged();
    }

    function deleteSubjectById(subId) {
      state.subjects = state.subjects.filter(s => s.id !== subId);
      closeModal();
      renderApp(false);
      markDataChanged();
      showToast('Mata pelajaran dihapus');
    }

    function addChapterToSubject(e, subId) {
      e.preventDefault();
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const title = document.getElementById('new-chap-title').value.trim();
      if (!title) return;
      sub.chapters.push({
        id: generateId('ch'),
        title,
        status: 'belum',
        note: document.getElementById('new-chap-note').value.trim()
      });
      openSubjectDetailModal(subId, true);
      renderApp(false);
      markDataChanged();
    }

    /**
     * ZERO-LAG CALENDAR INTERACTIONS
     */
    function selectCalendarDay(dateStr) {
      const prevDate = state.selectedCalendarDate;
      state.selectedCalendarDate = dateStr;

      const parts = dateStr.split('-').map(Number);
      const targetYear = parts[0];
      const targetMonth = parts[1] - 1;
      const monthChanged = (targetYear !== state.calendarYear || targetMonth !== state.calendarMonth);

      state.calendarYear = targetYear;
      state.calendarMonth = targetMonth;

      const gridEl = document.getElementById('calendar-days-grid');
      const monthLabelEl = document.getElementById('calendar-month-label');
      const timelinePanel = document.getElementById('calendar-timeline-panel');

      if (!gridEl || !timelinePanel) {
        renderApp(false);
        return;
      }

      if (monthChanged) {
        if (monthLabelEl) {
          monthLabelEl.textContent = `${MONTH_NAMES_ID[state.calendarMonth]} ${state.calendarYear}`;
        }
        gridEl.innerHTML = renderCalendarGridDays();
      } else if (prevDate !== dateStr) {
        const prevBtn = gridEl.querySelector(`button[data-date="${prevDate}"]`);
        if (prevBtn) {
          const isPrevToday = prevDate === TODAY_STR;
          const hasEvent = prevBtn.getAttribute('data-has-event') === '1';
          prevBtn.className = getCalendarDayBtnClass(false, isPrevToday);
          if (hasEvent && !prevBtn.querySelector('.cal-event-dot')) {
            const dot = document.createElement('span');
            dot.className = 'cal-event-dot w-1 h-1 rounded-full bg-champagneGold absolute bottom-1';
            prevBtn.appendChild(dot);
          }
        }

        const nextBtn = gridEl.querySelector(`button[data-date="${dateStr}"]`);
        if (nextBtn) {
          const isNextToday = dateStr === TODAY_STR;
          nextBtn.className = getCalendarDayBtnClass(true, isNextToday);
          const dot = nextBtn.querySelector('.cal-event-dot');
          if (dot) dot.remove();
        }
      }

      timelinePanel.innerHTML = renderCalendarTimelineInner(true);
    }

    function changeCalendarMonth(delta) {
      let m = state.calendarMonth + delta;
      let y = state.calendarYear;
      if (m < 0) {
        m = 11;
        y -= 1;
      } else if (m > 11) {
        m = 0;
        y += 1;
      }
      state.calendarMonth = m;
      state.calendarYear = y;

      const monthLabelEl = document.getElementById('calendar-month-label');
      const gridEl = document.getElementById('calendar-days-grid');

      if (!gridEl) {
        renderApp(false);
        return;
      }

      if (monthLabelEl) {
        monthLabelEl.textContent = `${MONTH_NAMES_ID[state.calendarMonth]} ${state.calendarYear}`;
      }

      const animClass = delta > 0 ? 'animate-cal-next' : 'animate-cal-prev';
      gridEl.classList.remove('animate-cal-next', 'animate-cal-prev');
      gridEl.innerHTML = renderCalendarGridDays();
      void gridEl.offsetWidth;
      gridEl.classList.add(animClass);
    }

    /**
     * ============================================================================
     * INTERACTIVE TWO-STEP LOGIN FLOW (USERNAME + OPTIONAL GITHUB GIST API)
     * ============================================================================
     */
    function renderAuthGate() {
      const container = document.getElementById('auth-card-container');
      if (!container) return;

      const step = state.auth.step;
      const stepAnim = state.auth.stepDirection === 'back' ? 'animate-ios-step-back' : 'animate-ios-step-forward';
      const hasPresetGist = Boolean(state.gist.gistId);

      if (step === 1) {
        container.innerHTML = `
          <div class="${stepAnim} bg-ivoryCard dark:bg-persianNavy rounded-[32px] p-6 sm:p-7 border border-desertStone/65 dark:border-persianIndigo shadow-xl">
            <!-- Step Progress Indicator -->
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-1.5">
                <span class="w-6 h-1.5 rounded-full bg-persianNavy dark:bg-champagneGold transition-all"></span>
                <span class="w-2.5 h-1.5 rounded-full bg-desertStone/60 dark:bg-persianIndigo transition-all"></span>
              </div>
              <span class="text-[11px] font-bold text-[#6E695F] dark:text-stone-400 tabular-nums">Langkah 1 dari 2</span>
            </div>

            <!-- Plan.os Mascot Greeting Header -->
            <div class="flex items-center gap-3.5 mb-5">
              <div id="auth-live-avatar" class="w-20 h-20 flex-shrink-0 flex items-center justify-center transition-transform duration-200">
                ${getPlanOsMascotSvg()}
              </div>
              <div class="min-w-0">
                <h1 class="text-xl font-bold text-inkCharcoal dark:text-ivoryCard">Selamat Datang</h1>
                <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-0.5 leading-relaxed">
                  Kenalan dulu yuk sebelum masuk ke ruang belajarmu.
                </p>
              </div>
            </div>

            ${hasPresetGist ? `
              <div class="mb-4 px-3.5 py-2.5 rounded-2xl bg-[#E5ECE8] dark:bg-[#1B2E26] text-sageOlive dark:text-[#98BBA8] text-xs font-semibold flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
                <span>Tautan Gist ID terdeteksi otomatis.</span>
              </div>
            ` : ''}

            <form onsubmit="handleAuthStep1Submit(event)" class="space-y-3.5">
              <div>
                <label for="auth-username" class="block text-xs font-bold text-inkCharcoal dark:text-ivoryCard mb-1.5">
                  Username / Nama Panggilan <span class="text-terracotta">*</span>
                </label>
                <input
                  id="auth-username"
                  type="text"
                  required
                  autocomplete="username"
                  value="${escapeHtml(state.auth.usernameInput)}"
                  oninput="updateAuthAvatarPreview(this.value)"
                  placeholder="Nama kamu"
                  class="w-full px-4 py-3 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/70 dark:border-persianIndigo text-sm font-medium focus:outline-none focus:ring-2 focus:ring-persianNavy dark:focus:ring-champagneGold"
                />
              </div>

              <div>
                <label for="auth-class" class="block text-xs font-semibold text-[#5C574E] dark:text-stone-300 mb-1.5">
                  Kelas / Jabatan OSIS <span class="text-[11px] font-normal text-[#8D867B]">(Opsional)</span>
                </label>
                <input
                  id="auth-class"
                  type="text"
                  value="${escapeHtml(state.auth.classInput)}"
                  placeholder="Contoh: XI MIPA 2 • Sekbid Akademik"
                  class="w-full px-4 py-2.5 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/70 dark:border-persianIndigo text-xs font-medium focus:outline-none focus:ring-2 focus:ring-persianNavy dark:focus:ring-champagneGold"
                />
              </div>

              <button type="submit" class="ios-tap w-full py-3.5 mt-2 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold flex items-center justify-center gap-2 shadow-md">
                <span>Lanjutkan</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
              </button>
            </form>
          </div>
        `;
      } else {
        const displayUser = escapeHtml(state.auth.usernameInput.trim() || state.profile.fullName);
        container.innerHTML = `
          <div class="${stepAnim} bg-ivoryCard dark:bg-persianNavy rounded-[32px] p-6 sm:p-7 border border-desertStone/65 dark:border-persianIndigo shadow-xl">
            <!-- Step Header + Back Button -->
            <div class="flex items-center justify-between mb-4">
              <button type="button" onclick="goBackToAuthStep1()" class="ios-tap inline-flex items-center gap-1 text-xs font-semibold text-[#6E695F] dark:text-stone-300">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                <span>Ubah Username</span>
              </button>
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1.5">
                  <span class="w-2.5 h-1.5 rounded-full bg-antiqueGold"></span>
                  <span class="w-6 h-1.5 rounded-full bg-persianNavy dark:bg-champagneGold"></span>
                </div>
                <span class="text-[11px] font-bold text-[#6E695F] dark:text-stone-400 tabular-nums">2 dari 2</span>
              </div>
            </div>

            <div class="mb-4">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#F3ECE0] dark:bg-[#332B1D] text-[#7D6636] dark:text-champagneGold text-[10px] font-bold uppercase tracking-wider mb-1.5">
                Opsional • Penyimpanan Cloud
              </span>
              <h2 class="text-lg font-bold text-inkCharcoal dark:text-ivoryCard">
                Halo, ${displayUser}!
              </h2>
              <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1 leading-relaxed">
                Hubungkan <strong>GitHub Gist API</strong> agar tugas, jadwal OSIS, dan catatan materimu tersimpan aman di awan. Kalau belum siap, kamu bisa langsung lewati tahap ini.
              </p>
            </div>

            <!-- Interactive Communicative Step-by-Step Guide Accordion -->
            <div class="mb-4 rounded-2xl bg-parchmentCanvas/85 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo overflow-hidden">
              <button type="button" onclick="toggleAuthGuide()" class="ios-tap w-full px-3.5 py-2.5 flex items-center justify-between text-left">
                <span class="flex items-center gap-2 text-xs font-bold text-persianNavy dark:text-champagneGold">
                  <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span>Cara mendapatkan Token GitHub (3 Langkah)</span>
                </span>
                <svg class="w-4 h-4 text-[#6E695F] transition-transform duration-200 ${state.auth.showGuide ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>

              ${state.auth.showGuide ? `
                <div class="animate-timeline-refresh px-3.5 pb-3.5 pt-1 border-t border-desertStone/40 dark:border-persianIndigo/70 space-y-2.5 text-[11px] text-[#4F4B43] dark:text-stone-300">
                  <div class="flex items-start gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">1</span>
                    <p>
                      Buka halaman token GitHub di
                      <a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer" class="font-bold underline text-persianNavy dark:text-champagneGold">github.com/settings/tokens</a>,
                      lalu tekan <strong>Generate new token (classic)</strong>.
                    </p>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">2</span>
                    <p>
                      Isi kolom <em>Note</em> bebas (misalnya <strong>PlanOS</strong>), lalu centang kotak <strong>gist</strong> saja dan tekan <strong>Generate token</strong>.
                    </p>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <span class="w-5 h-5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">3</span>
                    <p>
                      Salin kode token berawalan <code class="px-1 py-0.5 rounded bg-ivoryCard dark:bg-persianNavy font-mono text-[10px]">ghp_...</code> dan tempel pada kolom di bawah ini.
                    </p>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Optional Gist Credentials Form -->
            <form onsubmit="completeAuthWithCloud(event)" class="space-y-3">
              <div>
                <label for="auth-gist-token" class="block text-xs font-semibold mb-1">
                  Personal Access Token <span class="text-[11px] font-normal text-[#8D867B]">(Opsional)</span>
                </label>
                <div class="relative">
                  <input
                    id="auth-gist-token"
                    name="password"
                    type="${state.auth.showToken ? 'text' : 'password'}"
                    autocomplete="current-password"
                    value="${escapeHtml(state.gist.token)}"
                    oninput="state.gist.token = this.value"
                    placeholder="Tempel token ghp_xxxxxxxxxxxx"
                    class="w-full pl-3.5 pr-16 py-2.5 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/65 dark:border-persianIndigo text-xs focus:outline-none focus:ring-2 focus:ring-persianNavy dark:focus:ring-champagneGold"
                  />
                  <button type="button" onclick="toggleAuthTokenVisibility()" class="ios-tap absolute right-2.5 top-1/2 -translate-y-1/2 px-2 py-1 rounded-lg text-[10px] font-bold text-[#6E695F] dark:text-stone-300">
                    ${state.auth.showToken ? 'Sembunyi' : 'Lihat'}
                  </button>
                </div>
              </div>

              <div>
                <label for="auth-gist-id" class="block text-xs font-semibold mb-1">
                  Gist ID Lama <span class="text-[11px] font-normal text-[#8D867B]">(Kosongkan jika pengguna baru)</span>
                </label>
                <input
                  id="auth-gist-id"
                  type="text"
                  value="${escapeHtml(state.gist.gistId)}"
                  oninput="state.gist.gistId = this.value"
                  placeholder="Otomatis dibuatkan Secret Gist baru"
                  class="w-full px-3.5 py-2.5 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/65 dark:border-persianIndigo text-xs focus:outline-none focus:ring-2 focus:ring-persianNavy dark:focus:ring-champagneGold"
                />
              </div>

              <div class="pt-2 space-y-2">
                <button type="submit" ${state.auth.isSubmitting ? 'disabled' : ''} class="ios-tap w-full py-3.5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold flex items-center justify-center gap-2 shadow-md disabled:opacity-60">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
                  <span>${state.auth.isSubmitting ? 'Menghubungkan ke Gist...' : 'Hubungkan & Masuk'}</span>
                </button>

                <button type="button" onclick="completeAuthSkipCloud()" class="ios-tap w-full py-3 rounded-full bg-parchmentCanvas dark:bg-persianIndigo/80 text-inkCharcoal dark:text-ivoryCard text-xs font-semibold border border-desertStone/50 dark:border-persianIndigo">
                  Lewati Dulu & Masuk ke Dashboard
                </button>
              </div>
            </form>
          </div>
        `;
      }
    }

    function updateAuthAvatarPreview(val) {
      state.auth.usernameInput = val;
    }

    function handleAuthStep1Submit(e) {
      e.preventDefault();
      const inputEl = document.getElementById('auth-username');
      const classEl = document.getElementById('auth-class');
      const username = inputEl ? inputEl.value.trim() : '';
      if (!username) {
        showToast('Masukkan username terlebih dahulu', 'error');
        return;
      }

      state.auth.usernameInput = username;
      state.auth.classInput = classEl ? classEl.value.trim() : '';

      state.profile.fullName = username;
      if (state.auth.classInput) {
        const parts = state.auth.classInput.split('•').map(s => s.trim()).filter(Boolean);
        state.profile.schoolClass = parts[0] || '';
        state.profile.osisRole = parts[1] || '';
      } else {
        state.profile.schoolClass = '';
        state.profile.osisRole = '';
      }

      state.auth.stepDirection = 'forward';
      state.auth.step = 2;
      renderAuthGate();
    }

    function goBackToAuthStep1() {
      state.auth.stepDirection = 'back';
      state.auth.step = 1;
      renderAuthGate();
    }

    function toggleAuthGuide() {
      state.auth.showGuide = !state.auth.showGuide;
      state.auth.stepDirection = 'none';
      const container = document.getElementById('auth-card-container');
      renderAuthGate();
      if (container && container.firstElementChild) {
        container.firstElementChild.classList.remove('animate-ios-step-forward', 'animate-ios-step-back');
      }
    }

    function toggleAuthTokenVisibility() {
      state.auth.showToken = !state.auth.showToken;
      const tokenInput = document.getElementById('auth-gist-token');
      if (tokenInput) {
        tokenInput.type = state.auth.showToken ? 'text' : 'password';
        const toggleBtn = tokenInput.nextElementSibling;
        if (toggleBtn) toggleBtn.textContent = state.auth.showToken ? 'Sembunyi' : 'Lihat';
      }
    }

    async function completeAuthWithCloud(e) {
      e.preventDefault();
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();

      if (!token && !gistId) {
        showToast('Isi Token GitHub atau pilih Lewati Dulu', 'error');
        return;
      }

      state.auth.isSubmitting = true;
      renderAuthGate();

      try {
        if (gistId) {
          await syncPullFromGist(false);
          if (state.auth.usernameInput.trim()) {
            state.profile.fullName = state.auth.usernameInput.trim();
          }
          if (token) {
            await syncPushToGist(false);
          }
        } else if (token) {
          await syncPushToGist(false);
        }

        state.auth.isSubmitting = false;
        enterDashboardAfterAuth();
        showToast(`Selamat datang, ${state.profile.fullName}`);
      } catch (err) {
        state.auth.isSubmitting = false;
        renderAuthGate();
        showToast('Gagal sinkronisasi, cek token atau lewati dulu', 'error');
      }
    }

    function completeAuthSkipCloud() {
      enterDashboardAfterAuth();
      showToast(`Masuk sebagai ${state.profile.fullName} (Mode Sesi)`);
    }

    function enterDashboardAfterAuth() {
      state.auth.isAuthenticated = true;
      const gate = document.getElementById('auth-gate');
      const shell = document.getElementById('app-shell');
      const mobileDock = document.getElementById('mobile-bottom-dock');

      if (gate) gate.classList.add('hidden');
      if (shell) {
        shell.classList.remove('hidden');
        shell.classList.add('flex');
      }
      if (mobileDock) {
        mobileDock.classList.remove('hidden');
        mobileDock.classList.add('flex');
      }

      renderApp(true);
      requestAnimationFrame(positionMobileNavGlider);
    }

    function logoutToAuthGate() {
      closeModal();
      state.auth.isAuthenticated = false;
      state.auth.stepDirection = 'back';
      state.auth.step = 1;
      state.auth.usernameInput = state.profile.fullName !== 'Pengguna Baru' ? state.profile.fullName : '';

      const gate = document.getElementById('auth-gate');
      const shell = document.getElementById('app-shell');
      const mobileDock = document.getElementById('mobile-bottom-dock');
      if (shell) {
        shell.classList.add('hidden');
        shell.classList.remove('flex');
      }
      if (mobileDock) {
        mobileDock.classList.add('hidden');
        mobileDock.classList.remove('flex');
      }
      if (gate) gate.classList.remove('hidden');

      renderAuthGate();
      showToast('Kembali ke layar masuk');
    }

    // Initialize App with Ethical Two-Step Login Gate
    renderAuthGate();
  </script>
</body>
</html>
