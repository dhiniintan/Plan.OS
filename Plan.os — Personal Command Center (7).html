<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#EAE5DC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Plan.os — Personal Command Center</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Helvetica Neue"', 'system-ui', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Helvetica Neue"', 'system-ui', 'sans-serif'],
          },
          colors: {
            desertStone: '#C2BBB0',
            parchmentCanvas: '#EAE5DC',
            ivoryCard: '#FAF8F3',
            persianNavy: '#0F1D32',
            persianIndigo: '#172A46',
            antiqueGold: '#A88F59',
            champagneGold: '#D4B97A',
            sageOlive: '#4E6156',
            terracotta: '#B84A39',
            inkCharcoal: '#181816',
          }
        }
      }
    }
  </script>

  <style>
    /**
     * ============================================================================
     * CALIBRATED iOS MOTION SYSTEM (CRITICALLY DAMPED, ZERO-OVERSHOOT, 60/120FPS)
     * - Replaces heavy rubbery bounces with crisp exponential deceleration.
     * - Separates micro-button taps from large card surface depressions.
     * - Promotes fixed glass surfaces to dedicated GPU layers to prevent lag.
     * ============================================================================
     */
    :root {
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-snappy: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-sheet: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, .sf-display {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      letter-spacing: -0.022em;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* GPU-Accelerated Liquid Glass Surface */
    .ios-glass {
      background: rgba(250, 248, 243, 0.84);
      backdrop-filter: blur(22px) saturate(175%);
      -webkit-backdrop-filter: blur(22px) saturate(175%);
      box-shadow:
        0 10px 28px -6px rgba(15, 29, 50, 0.13),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .dark .ios-glass {
      background: rgba(16, 30, 51, 0.84);
      backdrop-filter: blur(22px) saturate(175%);
      -webkit-backdrop-filter: blur(22px) saturate(175%);
      box-shadow:
        0 12px 30px -6px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 0 rgba(212, 185, 122, 0.18);
    }

    /* Tactile Micro-Press for Buttons, Chips & Icons (Snappy 170ms) */
    .ios-tap {
      transition: transform 0.17s var(--ease-snappy), background-color 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
    }
    .ios-tap:active {
      transform: scale(0.95);
    }

    /* Subtle Surface Press for Large Cards (Restrained 0.988 scale) */
    .ios-card-tap {
      transition: transform 0.2s var(--ease-snappy), background-color 0.2s ease, opacity 0.2s ease;
    }
    .ios-card-tap:active {
      transform: scale(0.988);
    }

    /* Sliding Glider Pill in Navigation & Segmented Controls */
    .ios-glider {
      transition: transform 0.28s var(--ease-out-expo), width 0.28s var(--ease-out-expo);
      will-change: transform, width;
    }

    /* Macro Tab Transition (Used ONLY when switching primary tabs) */
    @keyframes iosTabEnter {
      0% {
        opacity: 0;
        transform: translate3d(0, 6px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    .animate-ios-tab {
      animation: iosTabEnter 0.24s var(--ease-out-expo) both;
    }

    /* Subtle Staggered Jump-In for List Items & Cards */
    @keyframes iosItemJumpIn {
      0% {
        opacity: 0;
        transform: translate3d(0, 7px, 0) scale(0.992);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }
    .animate-jump-in {
      animation: iosItemJumpIn 0.24s var(--ease-out-expo) both;
      animation-delay: var(--stagger-delay, 0ms);
    }

    /* Directional Calendar Month Grid Slide (Fast & Interruptible) */
    @keyframes calSlideNext {
      0% {
        opacity: 0.25;
        transform: translate3d(14px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    @keyframes calSlidePrev {
      0% {
        opacity: 0.25;
        transform: translate3d(-14px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    .animate-cal-next {
      animation: calSlideNext 0.2s var(--ease-out-expo) both;
    }
    .animate-cal-prev {
      animation: calSlidePrev 0.2s var(--ease-out-expo) both;
    }

    /* Fast Timeline Refresh on Calendar Date Selection */
    @keyframes timelineFadeIn {
      0% {
        opacity: 0.35;
        transform: translate3d(0, 4px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    .animate-timeline-refresh {
      animation: timelineFadeIn 0.18s var(--ease-out-expo) both;
    }

    /* Tactile Checkbox Completion Pop */
    @keyframes checkPop {
      0% { transform: scale(0.8); }
      55% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .animate-check-pop {
      animation: checkPop 0.22s var(--ease-snappy) both;
    }

    /* iOS Bottom Sheet & Modal Enter/Exit Animations */
    @keyframes iosSheetUp {
      0% {
        opacity: 0.5;
        transform: translate3d(0, 28px, 0) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }
    @keyframes iosSheetDown {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, 22px, 0) scale(0.985);
      }
    }
    @keyframes iosBackdropIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes iosBackdropOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .animate-ios-sheet {
      animation: iosSheetUp 0.26s var(--ease-sheet) both;
    }
    .animate-ios-sheet-exit {
      animation: iosSheetDown 0.16s ease-in both;
    }
    .animate-ios-backdrop {
      animation: iosBackdropIn 0.2s ease-out both;
    }
    .animate-ios-backdrop-exit {
      animation: iosBackdropOut 0.16s ease-in both;
    }

    /* Dynamic Island Toast Enter */
    @keyframes toastDropIn {
      0% {
        opacity: 0;
        transform: translate3d(0, -10px, 0) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }
    .animate-toast-in {
      animation: toastDropIn 0.22s var(--ease-out-expo) both;
    }

    /* Persian Navy Hero Surface */
    .persian-hero-surface {
      background: linear-gradient(145deg, #0F1D32 0%, #162947 65%, #11223B 100%);
      box-shadow: 0 14px 32px -10px rgba(15, 29, 50, 0.32);
    }

    /* Interactive Login Step Directional Transitions */
    @keyframes iosStepForward {
      0% {
        opacity: 0;
        transform: translate3d(14px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    @keyframes iosStepBack {
      0% {
        opacity: 0;
        transform: translate3d(-14px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    .animate-ios-step-forward {
      animation: iosStepForward 0.25s var(--ease-out-expo) both;
    }
    .animate-ios-step-back {
      animation: iosStepBack 0.25s var(--ease-out-expo) both;
    }

    /* Accessibility: Respect Reduced Motion Preferences */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-parchmentCanvas dark:bg-[#080F1A] text-inkCharcoal dark:text-[#F3EFE6] transition-colors duration-300 min-h-screen selection:bg-antiqueGold/30">

  <!-- INTERACTIVE TWO-STEP LOGIN GATE -->
  <div id="auth-gate" class="min-h-screen flex flex-col items-center justify-center px-4 py-8 relative overflow-hidden">
    <!-- Decorative Subtle Architectural Rings -->
    <div class="w-[340px] h-[340px] sm:w-[460px] sm:h-[460px] rounded-full border border-antiqueGold/25 absolute -top-28 -right-24 pointer-events-none"></div>
    <div class="w-[260px] h-[260px] sm:w-[360px] sm:h-[360px] rounded-full border border-persianNavy/10 dark:border-champagneGold/15 absolute -bottom-24 -left-20 pointer-events-none"></div>

    <!-- Top Quick Theme Toggle on Login Screen -->
    <div class="w-full max-w-md flex items-center justify-between mb-4 z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3L3 9l9 6 9-6-9-6z"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 15l9 6 9-6"/></svg>
        </div>
        <div>
          <span class="block text-sm font-bold text-persianNavy dark:text-ivoryCard leading-tight">Plan.os</span>
          <span class="block text-[10px] font-medium text-[#6E695F] dark:text-stone-400">Personal Command Center</span>
        </div>
      </div>

      <button onclick="toggleDarkMode()" aria-label="Ubah Tema Tampilan" class="ios-tap w-9 h-9 rounded-full bg-ivoryCard dark:bg-persianNavy border border-desertStone/60 dark:border-persianIndigo flex items-center justify-center text-inkCharcoal dark:text-champagneGold shadow-2xs">
        <svg class="w-4 h-4 dark:hidden" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>
    </div>

    <!-- Dynamic Auth Card Container -->
    <div id="auth-card-container" class="w-full max-w-md z-10"></div>
  </div>

  <!-- Main App Shell (Hidden until user completes login gate) -->
  <div id="app-shell" class="hidden max-w-5xl mx-auto min-h-screen md:py-6 md:px-5 flex-col md:flex-row gap-5">
    <!-- Desktop Floating Sidebar -->
    <aside class="hidden md:flex flex-col items-center justify-between w-16 py-4 px-2 rounded-[32px] ios-glass border border-white/70 dark:border-champagneGold/20 sticky top-6 h-[calc(100vh-3rem)] flex-shrink-0">
      <div class="flex flex-col items-center gap-3">
        <button id="desk-avatar-btn" onclick="openProfileModal()" title="Profil Diri" class="ios-tap w-10 h-10 rounded-full bg-persianNavy text-ivoryCard font-bold text-xs flex items-center justify-center border-2 border-antiqueGold/50 overflow-hidden">
          PL
        </button>
        <div class="w-6 h-px bg-desertStone/60 dark:bg-persianIndigo"></div>
        <button onclick="switchTab('today')" data-nav="today" title="Beranda" class="desk-nav ios-tap w-11 h-11 rounded-full flex items-center justify-center bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
        </button>
        <button onclick="switchTab('tasks')" data-nav="tasks" title="Tugas" class="desk-nav ios-tap w-11 h-11 rounded-full flex items-center justify-center text-[#6E695F] dark:text-stone-400 hover:text-persianNavy dark:hover:text-ivoryCard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <button onclick="switchTab('calendar')" data-nav="calendar" title="Jadwal" class="desk-nav ios-tap w-11 h-11 rounded-full flex items-center justify-center text-[#6E695F] dark:text-stone-400 hover:text-persianNavy dark:hover:text-ivoryCard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
        <button onclick="switchTab('lessons')" data-nav="lessons" title="Materi" class="desk-nav ios-tap w-11 h-11 rounded-full flex items-center justify-center text-[#6E695F] dark:text-stone-400 hover:text-persianNavy dark:hover:text-ivoryCard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </button>
      </div>

      <button onclick="openQuickAddModal('task')" title="Tambah Catatan" class="ios-tap w-11 h-11 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy flex items-center justify-center shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </aside>

    <!-- Primary Content Column -->
    <div class="flex-1 flex flex-col min-w-0">
      <header style="transform: translateZ(0);" class="sticky top-0 z-20 bg-parchmentCanvas/90 dark:bg-[#0B1424]/90 backdrop-blur-lg px-4 md:px-7 pt-4 pb-3 flex items-center justify-between gap-3 border-b border-desertStone/35 dark:border-persianIndigo/50 md:rounded-t-[28px]">
        <!-- Left: Tappable Profile Avatar + Identity -->
        <button onclick="openProfileModal()" class="ios-tap flex items-center gap-3 text-left min-w-0 group">

            PL
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 id="header-greeting" class="text-[17px] md:text-xl font-bold text-inkCharcoal dark:text-ivoryCard truncate">
                Halo, Pengguna

              <svg class="w-3.5 h-3.5 text-[#6E695F] dark:text-stone-400 flex-shrink-0 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </div>
            <p id="header-subtitle" class="text-[11px] text-[#666157] dark:text-stone-400 font-medium truncate">
              Personal Command Center
            </p>
          </div>
        </button>

        <!-- Right: Compact Status & Action Icons -->
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <!-- Cloud Sync Pill -->
          <button onclick="openCloudSyncModal()" aria-label="Sinkronisasi Cloud Gist" class="ios-tap h-9 px-3 rounded-full bg-ivoryCard dark:bg-persianNavy border border-desertStone/60 dark:border-persianIndigo flex items-center gap-1.5 text-[11px] font-semibold text-inkCharcoal dark:text-ivoryCard shadow-2xs">
            <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-[#8C857B]"></span>
            <span id="sync-status-label" class="hidden sm:inline">Gist Sync</span>
            <svg class="w-3.5 h-3.5 text-[#6E695F] dark:text-stone-400 sm:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
          </button>

          <!-- Reminders Bell -->
          <button onclick="openRemindersModal()" aria-label="Pengingat Tenggat" class="ios-tap relative w-9 h-9 rounded-full bg-ivoryCard dark:bg-persianNavy border border-desertStone/60 dark:border-persianIndigo flex items-center justify-center text-inkCharcoal dark:text-ivoryCard shadow-2xs">

          </button>

          </button>
        </div>
      </header>

      <!-- DYNAMIC VIEWPORT -->
      <main id="main-content" class="flex-1 px-4 md:px-7 pt-4 pb-28 md:pb-8 space-y-5">
        <!-- Rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- LIQUID GLASS FLOATING DOCK + DETACHED QUICK ADD BUTTON (MOBILE) -->
  <div id="mobile-bottom-dock" class="hidden md:hidden fixed bottom-4 inset-x-0 z-30 px-4 items-center justify-center gap-2.5 pointer-events-none">
    <!-- 4-Tab Liquid Glass Pill with Smooth Glider -->
    <nav id="mob-nav-bar" class="ios-glass pointer-events-auto relative p-1.5 rounded-full border border-white/70 dark:border-champagneGold/20 flex items-center">
      <!-- Animated Glider Background Pill -->

      <button onclick="switchTab('today')" data-nav="today" class="mob-nav-btn relative z-10 px-3.5 py-2 rounded-full flex items-center gap-1.5 text-xs font-semibold transition-colors duration-200 text-ivoryCard dark:text-persianNavy">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
        <span>Beranda</span>
      </button>

      <button onclick="switchTab('tasks')" data-nav="tasks" class="mob-nav-btn relative z-10 px-3.5 py-2 rounded-full flex items-center gap-1.5 text-xs font-semibold transition-colors duration-200 text-[#5D584F] dark:text-stone-300">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Tugas</span>
      </button>

      <button onclick="switchTab('calendar')" data-nav="calendar" class="mob-nav-btn relative z-10 px-3.5 py-2 rounded-full flex items-center gap-1.5 text-xs font-semibold transition-colors duration-200 text-[#5D584F] dark:text-stone-300">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

    /**
     * ============================================================================
     * DATE & CALENDAR UTILITIES
     * ============================================================================

    function getLocalTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function addDaysToStr(baseStr, offsetDays) {
      const [y, m, d] = baseStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    const TODAY_STR = getLocalTodayStr();
    const NOW_OBJ = new Date();
    const MONTH_NAMES_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const MONTH_SHORT_ID = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const DAY_NAMES_SHORT_ID = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

    function formatIndoDate(dateStr) {
      if (!dateStr) return '-';
      if (dateStr === TODAY_STR) return 'Hari ini';
      if (dateStr === addDaysToStr(TODAY_STR, 1)) return 'Besok';
      if (dateStr === addDaysToStr(TODAY_STR, -1)) return 'Kemarin';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return `${DAY_NAMES_SHORT_ID[d.getDay()]}, ${d.getDate()} ${MONTH_SHORT_ID[d.getMonth()]}`;
    }

    function getSchedulesForDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const targetDow = new Date(y, m - 1, d).getDay();
      return state.schedules.filter(s => {
        if (s.date === dateStr) return true;
        if (s.recurringWeekly) {
          const [oy, om, od] = s.date.split('-').map(Number);
          return new Date(oy, om - 1, od).getDay() === targetDow;
        }
        return false;
      });
    }

    function getCurrentWeekDates() {
      const now = new Date(NOW_OBJ.getFullYear(), NOW_OBJ.getMonth(), NOW_OBJ.getDate());
      const mondayOffset = (now.getDay() + 6) % 7;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - mondayOffset);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const dt = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        dates.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
      }
      return dates;
    }

    /**
     * ============================================================================
     * APPLICATION STATE (WITH EDITABLE PROFILE & GITHUB GIST SYNC)
     * ============================================================================
     */
    function getInitialUrlGistId() {
      try {
        return new URLSearchParams(window.location.search).get('gist_id') || '';
      } catch (e) {
        return '';
      }
    }

    const state = {
      currentTab: 'today',
      shouldAnimateTabEnter: true,
      justToggledTaskId: null,
      auth: {
        isAuthenticated: false,

    /**
     * ============================================================================
     * GITHUB GIST CLOUD SYNC ENGINE
     * ============================================================================
     */
    let autoSyncTimer = null;

    function buildSerializableData() {
      return {
        version: '3.2',
        updatedAt: new Date().toISOString(),
        profile: state.profile,
        tasks: state.tasks,
        schedules: state.schedules,
        subjects: state.subjects
      };
    }

    function applyImportedData(data) {
      if (!data || typeof data !== 'object') throw new Error('Format data tidak valid');
      if (data.profile && typeof data.profile === 'object') {
        state.profile = { ...state.profile, ...data.profile };
      }
      if (Array.isArray(data.tasks)) state.tasks = data.tasks;
      if (Array.isArray(data.schedules)) state.schedules = data.schedules;
      if (Array.isArray(data.subjects)) state.subjects = data.subjects;
    }

    function markDataChanged() {
      state.hasUnsyncedChanges = true;
      updateHeaderIdentity();
      if (state.gist.autoSync && state.gist.token.trim()) {
        clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => syncPushToGist(false), 1100);
      }
    }

    window.addEventListener('beforeunload', (e) => {
      if (state.hasUnsyncedChanges && !state.gist.token.trim()) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function updateUrlGistParam(gistId) {
      if (!gistId) return;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('gist_id', gistId);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    async function syncPushToGist(isManual = true) {
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();
      if (!token) {
        if (isManual) showToast('Isi Personal Access Token GitHub dulu', 'error');
        return;
      }

      state.gist.status = 'syncing';
      state.gist.lastError = '';
      updateHeaderIdentity();

      const payload = {
        description: `Plan.os — ${state.profile.fullName}`,
        public: false,
        files: {
          [state.gist.filename]: {
            content: JSON.stringify(buildSerializableData(), null, 2)
          }
        }
      };

      try {
        const endpoint = gistId ? `https://api.github.com/gists/${encodeURIComponent(gistId)}` : 'https://api.github.com/gists';
        const method = gistId ? 'PATCH' : 'POST';
        const res = await fetch(endpoint, {
          method,
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

        if (data.id) {
          state.gist.gistId = data.id;
          updateUrlGistParam(data.id);
        }
        const now = new Date();
        state.gist.status = 'synced';
        state.gist.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        state.hasUnsyncedChanges = false;
        updateHeaderIdentity();

        if (isManual) {
          showToast(gistId ? 'Tersimpan ke GitHub Gist' : 'Secret Gist baru berhasil dibuat');
          if (document.getElementById('gist-id-input')) openCloudSyncModal();
        }
      } catch (err) {
        state.gist.status = 'error';
        state.gist.lastError = err.message || 'Gagal terhubung ke GitHub';
        updateHeaderIdentity();
        if (isManual) {
          showToast(`Gagal sync: ${state.gist.lastError}`, 'error');
          if (document.getElementById('gist-id-input')) openCloudSyncModal();
        }
      }
    }

    async function syncPullFromGist(isManual = true) {
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();
      if (!gistId) {
        if (isManual) showToast('Masukkan Gist ID untuk memuat data', 'error');
        return;
      }

      state.gist.status = 'syncing';
      state.gist.lastError = '';
      updateHeaderIdentity();

      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, { headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

        const files = data.files || {};
        const targetFile = files[state.gist.filename] || Object.values(files).find(f => f && f.filename && f.filename.endsWith('.json'));
        if (!targetFile || !targetFile.content) throw new Error('File JSON tidak ditemukan pada Gist ini');

        applyImportedData(JSON.parse(targetFile.content));
        updateUrlGistParam(gistId);

        const now = new Date();
        state.gist.status = 'synced';
        state.gist.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        state.hasUnsyncedChanges = false;
        renderApp(false);

        if (isManual) {
          closeModal();
          showToast('Data & profil berhasil dimuat');
        }
      } catch (err) {
        state.gist.status = 'error';
        state.gist.lastError = err.message || 'Gagal mengambil Gist';
        updateHeaderIdentity();
        if (isManual) {
          showToast(`Gagal memuat: ${state.gist.lastError}`, 'error');
          if (document.getElementById('gist-id-input')) openCloudSyncModal();
        }
      }
    }

    /**
     * ============================================================================
     * HELPER UTILITIES, HEADER IDENTITY & NAVIGATION GLIDERS
     * ============================================================================
     */
    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getInitials(name) {
      const parts = (name || 'PL').trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function renderAvatarInner(sizeCls = 'text-xs') {
      const initials = getInitials(state.profile.fullName);
      if (state.profile.avatarUrl && state.profile.avatarUrl.trim()) {
        return `<img src="${escapeHtml(state.profile.avatarUrl.trim())}" alt="${escapeHtml(state.profile.fullName)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" class="w-full h-full object-cover" /><span style="display:none" class="w-full h-full items-center justify-center ${sizeCls}">${initials}</span>`;
      }
      return `<span class="${sizeCls}">${initials}</span>`;
    }

    function updateHeaderIdentity() {
      const firstName = (state.profile.fullName || 'Pengguna').trim().split(/\s+/)[0];
      const greetEl = document.getElementById('header-greeting');
      const subEl = document.getElementById('header-subtitle');
      const headerAvatar = document.getElementById('header-avatar');
      const deskAvatar = document.getElementById('desk-avatar-btn');
      const syncDot = document.getElementById('sync-status-dot');
      const syncLabel = document.getElementById('sync-status-label');

      const themeMeta = AVATAR_THEMES[state.profile.avatarTheme] || AVATAR_THEMES.navy;
      const subParts = [state.profile.schoolClass, state.profile.osisRole].filter(Boolean);

      if (greetEl) greetEl.textContent = `Halo, ${firstName}`;
      if (subEl) subEl.textContent = subParts.length > 0 ? subParts.join(' • ') : 'Personal Command Center';

      if (headerAvatar) {
        headerAvatar.className = `w-10 h-10 rounded-full font-bold text-xs flex items-center justify-center flex-shrink-0 ring-2 shadow-2xs overflow-hidden ${themeMeta.cls}`;
        headerAvatar.innerHTML = renderAvatarInner('text-xs');
      }
      if (deskAvatar) {
        deskAvatar.className = `ios-tap w-10 h-10 rounded-full font-bold text-xs flex items-center justify-center border-2 overflow-hidden ${themeMeta.cls}`;
        deskAvatar.innerHTML = renderAvatarInner('text-xs');
      }

      if (syncDot && syncLabel) {
        if (state.gist.status === 'syncing') {
          syncDot.className = 'w-2 h-2 rounded-full bg-antiqueGold animate-pulse';
          syncLabel.textContent = 'Menyimpan...';
        } else if (state.gist.status === 'synced') {
          syncDot.className = 'w-2 h-2 rounded-full bg-sageOlive dark:bg-[#7BB694]';
          syncLabel.textContent = `Gist ${state.gist.lastSyncedAt}`;
        } else if (state.gist.status === 'error') {
          syncDot.className = 'w-2 h-2 rounded-full bg-terracotta';
          syncLabel.textContent = 'Sync Gagal';
        } else if (state.gist.gistId) {
          syncDot.className = 'w-2 h-2 rounded-full bg-antiqueGold';
          syncLabel.textContent = 'Gist Terhubung';
        } else {
          syncDot.className = 'w-2 h-2 rounded-full bg-[#9A9388]';
          syncLabel.textContent = 'Gist Sync';
        }
      }
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bgCls = type === 'error'
        ? 'bg-terracotta text-white'
        : 'bg-persianNavy dark:bg-ivoryCard text-ivoryCard dark:text-persianNavy border border-antiqueGold/30';
      el.className = `${bgCls} px-4 py-2.5 rounded-full shadow-xl text-xs font-semibold flex items-center gap-2 animate-toast-in`;
      const icon = type === 'error'
        ? `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`
        : `<svg class="w-4 h-4 flex-shrink-0 text-antiqueGold" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
      el.innerHTML = `${icon}<span>${escapeHtml(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate3d(0, -6px, 0)';
        el.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
        setTimeout(() => el.remove(), 210);
      }, 2200);
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      showToast(isDark ? 'Tampilan Malam Persian Indigo' : 'Tampilan Siang Parchment');

    function positionMobileNavGlider() {
      const navBar = document.getElementById('mob-nav-bar');
      const glider = document.getElementById('mob-nav-glider');
      if (!navBar || !glider) return;

      const activeBtn = navBar.querySelector(`.mob-nav-btn[data-nav="${state.currentTab}"]`);
      if (!activeBtn) return;

      const offsetX = activeBtn.offsetLeft - 6;
      glider.style.width = `${activeBtn.offsetWidth}px`;
      glider.style.transform = `translate3d(${offsetX}px, 0, 0)`;

      navBar.querySelectorAll('.mob-nav-btn').forEach(btn => {
        const isCurrent = btn.getAttribute('data-nav') === state.currentTab;
        if (isCurrent) {
          btn.classList.remove('text-[#5D584F]', 'dark:text-stone-300');
          btn.classList.add('text-ivoryCard', 'dark:text-persianNavy');

          btn.classList.remove('text-ivoryCard', 'dark:text-persianNavy');
          btn.classList.add('text-[#5D584F]', 'dark:text-stone-300');
        }
      });
    }

                      <div class="w-full h-1.5 bg-parchmentCanvas dark:bg-persianIndigo rounded-full overflow-hidden mt-2">
                        <div class="h-full bg-persianNavy dark:bg-champagneGold rounded-full" style="width: ${pct}%; transition: width 0.4s var(--ease-out-expo);"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>
        </div>
      `;
    }

    // Reusable Clean Task Card with Purposeful Jump-In & Tactile Checkmark Pop
    function renderTaskCard(task, staggerIndex = -1) {
      const cat = CATEGORY_META[task.category] || CATEGORY_META['Sekolah'];
      const prio = PRIORITY_META[task.priority] || PRIORITY_META['Sedang'];
      const subTotal = task.subtasks.length;
      const subDone = task.subtasks.filter(s => s.done).length;
      const isJustToggled = state.justToggledTaskId === task.id;
      const animClass = staggerIndex >= 0 ? 'animate-jump-in' : '';
      const staggerStyle = staggerIndex >= 0 ? `style="--stagger-delay: ${Math.min(staggerIndex, 5) * 24}ms;"` : '';

      return `
        <div onclick="openTaskDetailModal('${task.id}')" ${staggerStyle} class="${animClass} ios-card-tap p-3.5 rounded-[22px] bg-ivoryCard dark:bg-persianNavy/85 border border-desertStone/55 dark:border-persianIndigo border-l-4 ${cat.accentBorder} flex items-center justify-between gap-3 cursor-pointer ${task.completed ? 'opacity-60' : ''}">
          <div class="flex items-start gap-3 min-w-0">
            <button onclick="toggleTaskDone('${task.id}', event)" aria-label="Tandai selesai" class="ios-tap mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isJustToggled ? 'animate-check-pop' : ''} ${task.completed ? 'bg-persianNavy dark:bg-champagneGold border-persianNavy dark:border-champagneGold text-ivoryCard dark:text-persianNavy' : 'border-desertStone dark:border-stone-500 bg-transparent'}">
              ${task.completed ? `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
            </button>
            <div class="min-w-0">
              <div class="flex items-center flex-wrap gap-1.5 mb-1">
                <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${cat.badge}">
                  ${cat.iconSvg}
                  <span>${task.category}</span>
                </span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${prio.badge}">${prio.label}</span>
              </div>
              <h4 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard truncate ${task.completed ? 'line-through' : ''}">
                ${escapeHtml(task.title)}
              </h4>
              <p class="text-[11px] text-[#6E695F] dark:text-stone-400 mt-0.5 tabular-nums">
                ${formatIndoDate(task.deadlineDate)} • ${task.deadlineTime}
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            ${subTotal > 0 ? `
              <span class="px-2 py-1 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-[10px] font-bold text-persianNavy dark:text-champagneGold tabular-nums">
                ${subDone}/${subTotal}
              </span>
            ` : ''}
            <svg class="w-4 h-4 text-[#8D867B]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * TAB 2: TUGAS & SUBTASK (PARTIAL LIST REFRESH + SLIDING SEGMENTED GLIDER)
     * ============================================================================
     */
    function getFilteredTasks() {
      const q = state.searchQuery.toLowerCase();
      return state.tasks
        .filter(t => {
          const matchStatus = state.taskFilterStatus === 'active' ? !t.completed : t.completed;
          const matchCat = state.taskFilterCategory === 'Semua' || t.category === state.taskFilterCategory;
          const matchSearch = !q || t.title.toLowerCase().includes(q) || (t.notes && t.notes.toLowerCase().includes(q));
          return matchStatus && matchCat && matchSearch;
        })
        .sort((a, b) => PRIORITY_META[b.priority].weight - PRIORITY_META[a.priority].weight);
    }

    function renderTasksListInner(useStagger = true) {
      const filtered = getFilteredTasks();
      if (state.tasks.length === 0) {
        return `
          <div class="p-8 rounded-[26px] bg-ivoryCard dark:bg-persianNavy/70 border border-desertStone/50 dark:border-persianIndigo text-center">
            <div class="w-12 h-12 rounded-2xl bg-parchmentCanvas dark:bg-persianIndigo text-persianNavy dark:text-champagneGold flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            </div>
            <p class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Daftar tugas masih kosong</p>
            <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1 max-w-xs mx-auto leading-relaxed">
              Catat PR pelajaran, agenda rapat OSIS, atau project pribadimu dan pecah menjadi checklist kecil.
            </p>
            <button onclick="openQuickAddModal('task')" class="ios-tap mt-4 px-5 py-2.5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">
              + Tambah Tugas Baru
            </button>
          </div>
        `;
      }
      if (filtered.length === 0) {
        return `
          <div class="p-8 rounded-[24px] bg-ivoryCard dark:bg-persianNavy/70 border border-desertStone/50 dark:border-persianIndigo text-center">
            <p class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Tidak ada tugas yang cocok</p>
            <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1">Ubah filter kategori atau kata kunci pencarian.</p>
            <button onclick="resetTaskFilters()" class="ios-tap mt-3 px-4 py-2 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-xs font-bold">
              Reset Filter
            </button>
          </div>
        `;
      }
      return filtered.map((t, idx) => renderTaskCard(t, useStagger ? idx : -1)).join('');
    }

    function renderTasksTab(animateTab = false) {
      const categories = ['Semua', 'Sekolah', 'OSIS', 'Project', 'Rutin'];
      const activeCount = state.tasks.filter(t => !t.completed).length;
      const doneCount = state.tasks.filter(t => t.completed).length;
      const wrapperAnim = animateTab ? 'animate-ios-tab' : '';

      return `
        <div class="${wrapperAnim} space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-bold text-inkCharcoal dark:text-ivoryCard">Daftar Tugas</h2>
              <p class="text-xs text-[#6E695F] dark:text-stone-400">Ketuk tugas untuk memecah langkah kerja</p>
            </div>
            <button onclick="openQuickAddModal('task')" class="ios-tap px-4 py-2 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">

            </button>
          </div>

          <!-- Search Input (Updates ONLY #tasks-list-container so focus & layout never jump) -->
          <div class="relative">
            <input
              id="tasks-search-input"
              type="text"
              value="${escapeHtml(state.searchQuery)}"
              oninput="handleTaskSearch(this.value)"

            />
            <svg class="w-4 h-4 text-[#7E786E] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>

          <!-- Category Filter Chips -->
          <div id="tasks-category-bar" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5">

              return `
                <button onclick="setTaskCategoryFilter('${cat}')" data-cat="${cat}" class="ios-tap px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${isSelected ? 'bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy shadow-2xs' : 'bg-ivoryCard dark:bg-persianNavy/70 text-[#5C574E] dark:text-stone-300 border border-desertStone/50 dark:border-persianIndigo'}">
                  ${cat}
                </button>
              `;
            }).join('')}
          </div>

          <!-- iOS Segmented Control with Sliding Glider -->
          <div id="tasks-status-bar" class="relative grid grid-cols-2 p-1 rounded-2xl bg-desertStone/35 dark:bg-persianNavy border border-desertStone/40 dark:border-persianIndigo">
            <div id="tasks-status-glider" class="ios-glider absolute top-1 bottom-1 left-1 rounded-xl bg-ivoryCard dark:bg-persianIndigo shadow-2xs pointer-events-none"></div>
            <button onclick="setTaskStatusFilter('active')" data-status="active" class="relative z-10 py-1.5 rounded-xl text-xs font-bold transition-colors duration-200 ${state.taskFilterStatus === 'active' ? 'text-persianNavy dark:text-ivoryCard' : 'text-[#635E54] dark:text-stone-400'}">
              Aktif (<span id="tasks-active-count">${activeCount}</span>)
            </button>
            <button onclick="setTaskStatusFilter('completed')" data-status="completed" class="relative z-10 py-1.5 rounded-xl text-xs font-bold transition-colors duration-200 ${state.taskFilterStatus === 'completed' ? 'text-persianNavy dark:text-ivoryCard' : 'text-[#635E54] dark:text-stone-400'}">
              Selesai (<span id="tasks-done-count">${doneCount}</span>)
            </button>
          </div>

          <!-- Task List Container -->
          <div id="tasks-list-container" class="space-y-2.5">
            ${renderTasksListInner(true)}
          </div>
        </div>
      `;
    }

    function handleTaskSearch(val) {
      state.searchQuery = val;
      const listEl = document.getElementById('tasks-list-container');
      if (listEl) listEl.innerHTML = renderTasksListInner(false);
    }

    function setTaskCategoryFilter(cat) {
      if (state.taskFilterCategory === cat) return;
      state.taskFilterCategory = cat;
      const bar = document.getElementById('tasks-category-bar');
      if (bar) {
        bar.querySelectorAll('button[data-cat]').forEach(btn => {
          const active = btn.getAttribute('data-cat') === cat;
          btn.className = active
            ? 'ios-tap px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy shadow-2xs'
            : 'ios-tap px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-ivoryCard dark:bg-persianNavy/70 text-[#5C574E] dark:text-stone-300 border border-desertStone/50 dark:border-persianIndigo';
        });
      }
      const listEl = document.getElementById('tasks-list-container');
      if (listEl) listEl.innerHTML = renderTasksListInner(true);
    }

    function setTaskStatusFilter(status) {
      if (state.taskFilterStatus === status) return;
      state.taskFilterStatus = status;
      const bar = document.getElementById('tasks-status-bar');
      if (bar) {
        bar.querySelectorAll('button[data-status]').forEach(btn => {
          const active = btn.getAttribute('data-status') === status;
          btn.className = `relative z-10 py-1.5 rounded-xl text-xs font-bold transition-colors duration-200 ${active ? 'text-persianNavy dark:text-ivoryCard' : 'text-[#635E54] dark:text-stone-400'}`;
        });
      }
      requestAnimationFrame(positionTasksStatusGlider);
      const listEl = document.getElementById('tasks-list-container');
      if (listEl) listEl.innerHTML = renderTasksListInner(true);
    }

    function resetTaskFilters() {
      state.taskFilterCategory = 'Semua';
      state.searchQuery = '';
      const searchInput = document.getElementById('tasks-search-input');
      if (searchInput) searchInput.value = '';
      setTaskCategoryFilter('Semua');
      const listEl = document.getElementById('tasks-list-container');
      if (listEl) listEl.innerHTML = renderTasksListInner(true);
    }

    /**
     * ============================================================================
     * TAB 3: KALENDER & JADWAL (ZERO-LAG PARTIAL UPDATES & DIRECTIONAL SLIDE)
     * - Tapping dates or changing months updates ONLY the inner grid/timeline.
     * - Outer calendar shell stays stationary so rapid tapping is 100% lag-free.
     * ============================================================================
     */
    function renderCalendarTimelineInner(animateRefresh = false) {
      const selDate = state.selectedCalendarDate;
      const daySchedules = getSchedulesForDate(selDate);
      const dayTasks = state.tasks.filter(t => t.deadlineDate === selDate);

      const timeline = [
        ...daySchedules.map(s => ({
          type: 'schedule',
          time: s.startTime,
          endTime: s.endTime,
          title: s.title,
          subtitle: s.recurringWeekly ? `${s.location} • Rutin Mingguan` : s.location,
          category: s.category,
          id: s.id
        })),
        ...dayTasks.map(t => ({
          type: 'deadline',
          time: t.deadlineTime,
          title: `Tenggat: ${t.title}`,
          subtitle: `${t.priority} • ${t.completed ? 'Tuntas' : 'Belum Selesai'}`,
          category: t.category,
          completed: t.completed,
          id: t.id
        }))
      ].sort((a, b) => a.time.localeCompare(b.time));

      const animCls = animateRefresh ? 'animate-timeline-refresh' : '';

      return `
        <div class="${animCls}">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-base font-bold text-inkCharcoal dark:text-ivoryCard">Agenda ${formatIndoDate(selDate)}</h3>
              <p class="text-xs text-[#6E695F] dark:text-stone-400">${daySchedules.length} kegiatan • ${dayTasks.length} tenggat tugas</p>
            </div>
            ${selDate !== TODAY_STR ? `
              <button onclick="selectCalendarDay('${TODAY_STR}')" class="ios-tap px-3 py-1 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-xs font-semibold">Hari Ini</button>
            ` : ''}
          </div>

          <div class="space-y-3">
            ${timeline.length === 0 ? `
              <div class="p-8 rounded-[22px] bg-parchmentCanvas/70 dark:bg-persianIndigo/50 text-center">
                <div class="w-11 h-11 rounded-2xl bg-ivoryCard dark:bg-persianNavy text-persianNavy dark:text-champagneGold flex items-center justify-center mx-auto mb-2.5 border border-desertStone/40 dark:border-persianIndigo">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <p class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Jadwal masih kosong</p>
                <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1 max-w-xs mx-auto">Tambahkan jadwal pelajaran sekolah, rapat OSIS, atau agenda rutin agar tidak bentrok.</p>
                <button onclick="openQuickAddModal('schedule')" class="ios-tap mt-3.5 px-4 py-2 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">
                  + Tambah Jadwal
                </button>
              </div>
            ` : timeline.map(item => {
              const cat = CATEGORY_META[item.category] || CATEGORY_META['Sekolah'];
              const isDeadline = item.type === 'deadline';
              return `
                <div onclick="${isDeadline ? `openTaskDetailModal('${item.id}')` : ''}" class="flex gap-3 items-stretch ${isDeadline ? 'cursor-pointer' : ''}">
                  <div class="w-12 text-right pt-1 flex-shrink-0 tabular-nums">
                    <span class="text-xs font-bold text-inkCharcoal dark:text-ivoryCard">${item.time}</span>
                    <span class="block text-[10px] text-[#7D776D]">${item.endTime || 'Batas'}</span>
                  </div>
                  <div class="flex flex-col items-center">
                    <span class="w-2.5 h-2.5 rounded-full mt-1.5 ${isDeadline ? 'bg-terracotta ring-4 ring-terracotta/20' : cat.dotColor}"></span>
                    <span class="w-px flex-1 bg-desertStone/60 dark:bg-persianIndigo my-1"></span>
                  </div>
                  <div class="flex-1 p-3.5 rounded-[20px] bg-parchmentCanvas/75 dark:bg-persianIndigo/75 mb-1">
                    <div class="flex items-center justify-between gap-2 mb-1">
                      <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${cat.badge}">
                        ${cat.iconSvg}
                        <span>${item.category}</span>
                      </span>
                      ${isDeadline ? `
                        <span class="text-[10px] font-bold text-terracotta dark:text-[#F09A8E]">Tenggat</span>
                      ` : `
                        <div class="flex items-center gap-1.5">
                          <button onclick="openEditScheduleModal('${item.id}')" class="ios-tap px-2.5 py-0.5 rounded-full bg-ivoryCard dark:bg-persianNavy text-[10px] font-semibold">Edit</button>
                          <button onclick="deleteScheduleById('${item.id}')" class="ios-tap px-2.5 py-0.5 rounded-full bg-[#F5E4E1] dark:bg-[#3A1E1B] text-[10px] font-semibold text-terracotta">Hapus</button>
                        </div>
                      `}
                    </div>
                    <h4 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard ${item.completed ? 'line-through opacity-60' : ''}">${escapeHtml(item.title)}</h4>
                    <p class="text-xs text-[#6E695F] dark:text-stone-300 mt-0.5">${escapeHtml(item.subtitle)}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCalendarTab(animateTab = false) {

      const wrapperAnim = animateTab ? 'animate-ios-tab' : '';

      return `
        <div class="${wrapperAnim} grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- Calendar Card (Stationary Persian Navy Surface) -->
          <div class="lg:col-span-5 persian-hero-surface text-ivoryCard rounded-[28px] p-5 border border-antiqueGold/30 h-fit">
            <div class="flex items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-1.5">
                <button onclick="changeCalendarMonth(-1)" aria-label="Bulan Sebelumnya" class="ios-tap w-8 h-8 rounded-full bg-ivoryCard/10 hover:bg-ivoryCard/20 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h2 id="calendar-month-label" class="text-sm font-bold px-1 min-w-[122px] text-center">${calMonthFullLabel}</h2>

            </div>

                ${renderCalendarGridDays()}
              </div>
            </div>

            <div class="flex items-center justify-between text-[10px] text-[#C2BBB0] mt-4 pt-3 border-t border-ivoryCard/15">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-champagneGold"></span> Terpilih</span>
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border border-ivoryCard"></span> Hari Ini</span>

            </div>
          </div>

          <!-- Daily Timeline Panel -->
          <div id="calendar-timeline-panel" class="lg:col-span-7 bg-ivoryCard dark:bg-persianNavy/80 rounded-[28px] p-5 border border-desertStone/55 dark:border-persianIndigo">
            ${renderCalendarTimelineInner(false)}
          </div>
        </div>
      `;
    }

    function getCalendarDayBtnClass(isSelected, isToday) {
      let cls = 'cal-day-btn ios-tap relative w-9 h-9 mx-auto rounded-full flex items-center justify-center transition-colors duration-150 ';
      if (isSelected) {
        cls += 'bg-champagneGold text-persianNavy font-bold shadow-sm';
      } else if (isToday) {
        cls += 'border border-champagneGold text-ivoryCard font-bold';
      } else {
        cls += 'text-[#D5CFC4] hover:bg-ivoryCard/10';
      }
      return cls;
    }

    function renderCalendarGridDays() {
      const year = state.calendarYear;
      const month = state.calendarMonth;
      const firstDayJs = new Date(year, month, 1).getDay();
      const mondayOffset = (firstDayJs + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const scheduledDates = new Set([
        ...state.schedules.map(s => s.date),
        ...state.tasks.map(t => t.deadlineDate)
      ]);

      const recurringDows = new Set(
        state.schedules
          .filter(s => s.recurringWeekly)
          .map(s => {
            const [oy, om, od] = s.date.split('-').map(Number);
            return new Date(oy, om - 1, od).getDay();
          })
      );

      let cells = '';
      for (let e = 0; e < mondayOffset; e++) cells += `<span></span>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dow = new Date(year, month, day).getDay();
        const isSelected = dateStr === state.selectedCalendarDate;
        const isToday = dateStr === TODAY_STR;
        const hasEvent = scheduledDates.has(dateStr) || recurringDows.has(dow);
        const cls = getCalendarDayBtnClass(isSelected, isToday);

        cells += `
          <button onclick="selectCalendarDay('${dateStr}')" data-date="${dateStr}" data-has-event="${hasEvent ? '1' : '0'}" class="${cls}">
            <span>${day}</span>
            ${hasEvent && !isSelected ? `<span class="cal-event-dot w-1 h-1 rounded-full bg-champagneGold absolute bottom-1"></span>` : ''}
          </button>
        `;
      }
      return cells;
    }

    /**
     * ============================================================================

    function computeWeeklyRecapStats() {
      const weekDates = new Set(getCurrentWeekDates());
      const weekTasks = state.tasks.filter(t => weekDates.has(t.deadlineDate) || t.completed);
      const completedAll = state.tasks.filter(t => t.completed);

      const sekolahTotal = weekTasks.filter(t => t.category === 'Sekolah').length;
      const sekolahDone = weekTasks.filter(t => t.category === 'Sekolah' && t.completed).length;

      const osisTotal = weekTasks.filter(t => t.category === 'OSIS').length;
      const osisDone = weekTasks.filter(t => t.category === 'OSIS' && t.completed).length;

      const otherTotal = weekTasks.filter(t => t.category === 'Project' || t.category === 'Rutin').length;
      const otherDone = weekTasks.filter(t => (t.category === 'Project' || t.category === 'Rutin') && t.completed).length;

      const totalCount = Math.max(weekTasks.length, 1);
      const doneCount = weekTasks.filter(t => t.completed).length;
      const completionRate = Math.round((doneCount / totalCount) * 100);

      const totalChapters = state.subjects.reduce((acc, s) => acc + s.chapters.length, 0);
      const masteredChapters = state.subjects.reduce((acc, s) => acc + s.chapters.filter(c => c.status === 'paham').length, 0);

      return {
        weekTotal: weekTasks.length,
        weekDone: doneCount,
        totalCompletedEver: completedAll.length,
        completionRate,
        sekolahTotal,
        sekolahDone,
        osisTotal,
        osisDone,
        otherTotal,
        otherDone,
        totalChapters,
        masteredChapters
      };
    }

    function handleProfilePhotoUpload(event) {
      const file = event.target && event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(loadEvent) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 220;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          pendingProfileAvatarData = canvas.toDataURL('image/jpeg', 0.78);
          const previewEl = document.getElementById('profile-preview-avatar');
          if (previewEl) {
            previewEl.innerHTML = `<img src="${pendingProfileAvatarData}" alt="Preview" class="w-full h-full object-cover" />`;
          }
          showToast('Foto dipilih, tekan Simpan Profil');
        };
        img.src = loadEvent.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearProfilePhoto() {
      pendingProfileAvatarData = '';
      const previewEl = document.getElementById('profile-preview-avatar');
      if (previewEl) {
        previewEl.innerHTML = `<span class="text-base">${getInitials(state.profile.fullName)}</span>`;

      const taskGoalVal = parseInt(document.getElementById('prof-task-goal').value, 10) || 5;

      const mottoVal = document.getElementById('prof-motto').value.trim();
      const themeRadio = document.querySelector('input[name="prof-avatar-theme"]:checked');

      if (nameVal) state.profile.fullName = nameVal;
      state.profile.schoolClass = classVal;
      state.profile.osisRole = osisVal;
      state.profile.dailyTaskGoal = Math.max(1, Math.min(20, taskGoalVal));
      state.profile.dailyFocusGoalHours = Math.max(0.5, Math.min(12, hourGoalVal));
      state.profile.motto = mottoVal;
      if (themeRadio) state.profile.avatarTheme = themeRadio.value;
      if (pendingProfileAvatarData !== null) {
        state.profile.avatarUrl = pendingProfileAvatarData;
      }

      closeModal();
      renderApp(false);
      markDataChanged();
      showToast('Profil diperbarui');

      root.innerHTML = `

              <div class="text-center tabular-nums">

              <button type="button" onclick="adjustFocusHours(0.5)" class="ios-tap w-12 h-12 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-lg font-bold flex items-center justify-center">+0.5</button>

          </div>
        </div>
      `;
    }

    function adjustFocusHours(delta) {
      const nextVal = Math.max(0, Math.min(16, Math.round((state.profile.focusHoursToday + delta) * 10) / 10));
      state.profile.focusHoursToday = nextVal;
      const disp = document.getElementById('focus-hours-display');
      if (disp) disp.textContent = `${nextVal}j`;
      renderApp(false);
      markDataChanged();
    }

    /**
     * ============================================================================
     * MASTER VIEW RENDERER
     * ============================================================================
     */
    function renderApp(animateTab = false) {
      updateHeaderIdentity();

      const bellBadge = document.getElementById('bell-badge');
      if (bellBadge) {
        const hasActive = state.tasks.some(t => !t.completed);
        bellBadge.style.display = hasActive ? 'block' : 'none';
      }

      const main = document.getElementById('main-content');
      if (!main) return;

      if (state.currentTab === 'today') {
        main.innerHTML = renderDashboardTab(animateTab);
      } else if (state.currentTab === 'tasks') {
        main.innerHTML = renderTasksTab(animateTab);
        requestAnimationFrame(positionTasksStatusGlider);
      } else if (state.currentTab === 'calendar') {
        main.innerHTML = renderCalendarTab(animateTab);
      } else if (state.currentTab === 'lessons') {
        main.innerHTML = renderLessonsTab(animateTab);
      }
    }

    function saveEditedTask(e, taskId) {
      e.preventDefault();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.title = document.getElementById('edit-task-title').value.trim();
      task.category = document.getElementById('edit-task-cat').value;
      task.priority = document.getElementById('edit-task-prio').value;
      task.deadlineDate = document.getElementById('edit-task-date').value;
      task.deadlineTime = document.getElementById('edit-task-time').value;
      task.notes = document.getElementById('edit-task-notes').value.trim();
      openTaskDetailModal(taskId, true);
      renderApp(false);
      markDataChanged();
      showToast('Tugas diperbarui');
    }

    function positionQuickAddGlider(mode) {
      const bar = document.getElementById('qa-mode-bar');
      const glider = document.getElementById('qa-mode-glider');
      if (!bar || !glider) return;
      const activeBtn = bar.querySelector(`button[data-mode="${mode}"]`);
      if (!activeBtn) return;
      const offsetX = activeBtn.offsetLeft - 4;
      glider.style.width = `${activeBtn.offsetWidth}px`;
      glider.style.transform = `translate3d(${offsetX}px, 0, 0)`;

      bar.querySelectorAll('button[data-mode]').forEach(btn => {
        const isCurrent = btn.getAttribute('data-mode') === mode;
        btn.className = `relative z-10 py-1.5 rounded-xl text-xs font-bold transition-colors duration-200 ${isCurrent ? 'text-ivoryCard dark:text-persianNavy' : 'text-[#6E695F] dark:text-stone-400'}`;
      });
    }

    function switchQuickAddMode(mode) {
      const formContainer = document.getElementById('qa-form-container');
      if (!formContainer) {
        openQuickAddModal(mode);
        return;
      }
      positionQuickAddGlider(mode);
      formContainer.innerHTML = renderQuickAddFormInner(mode);
    }
