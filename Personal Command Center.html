<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#181A1F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Plan.os — Personal Command Center Pelajar & OSIS</title>

  <!-- Google Fonts: Plus Jakarta Sans & Inter for Editorial UI/UX Clarity -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            stoneCanvas: '#F3F1ED',
            taupeCard: '#CFC6B8',
            taupeDark: '#26231F',
            obsidian: '#181A1F',
            solar: '#FFD43B',
            coral: '#FF5E3A',
            slateTeal: '#4A6B7C',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Soft Glowing Bubbles inspired by Be.run Hero Card */
    .bubble-yellow {
      background: radial-gradient(circle at 35% 35%, #FFE875 0%, #FFD43B 60%, #F5B82E 100%);
      box-shadow: 0 12px 32px rgba(255, 212, 59, 0.45), inset 0 2px 8px rgba(255, 255, 255, 0.65);
    }
    .bubble-coral {
      background: radial-gradient(circle at 35% 35%, #FF8A70 0%, #FF5E3A 65%, #E04322 100%);
      box-shadow: 0 10px 26px rgba(255, 94, 58, 0.42), inset 0 2px 6px rgba(255, 255, 255, 0.45);
    }
    .bubble-obsidian {
      background: radial-gradient(circle at 30% 30%, #343842 0%, #181A1F 75%, #101114 100%);
      box-shadow: 0 10px 24px rgba(24, 26, 31, 0.35), inset 0 1px 4px rgba(255, 255, 255, 0.18);
    }

    /* Smooth Modal & Drawer Animations */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#E6E2DA] dark:bg-[#0D0E11] text-[#181A1F] dark:text-[#F4F2EE] transition-colors duration-200 min-h-screen">

            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>

        <!-- TOP EDITORIAL HEADER BAR (Fusing Image 1 Greeting + Image 2 Pill Search & Theme Switch) -->

            <!-- Pill Search (Inspired by Image 1 & 2) -->

              </svg>
            </div>

            <!-- Pill Theme Switch (Inspired by Image 2 Top-Right Switch) -->
            <!-- Mobile Bell & Cloud Sync quick triggers -->
            <button onclick="openRemindersModal()" aria-label="Pengingat" class="md:hidden relative w-9 h-9 rounded-full bg-white dark:bg-[#1C1E24] border border-stone-200/80 dark:border-stone-800 flex items-center justify-center text-stone-600 dark:text-stone-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              <span class="reminder-dot absolute top-1 right-1.5 w-2 h-2 rounded-full bg-coral"></span>

            <button onclick="openCloudSyncModal()" aria-label="Cloud Sync GitHub Gist" class="md:hidden relative w-9 h-9 rounded-full bg-white dark:bg-[#1C1E24] border border-stone-200/80 dark:border-stone-800 flex items-center justify-center text-stone-600 dark:text-stone-300">

            <button onclick="openQuickAddModal('task')" class="px-4 py-2 rounded-full bg-obsidian dark:bg-solar text-white dark:text-obsidian text-xs font-display font-bold shadow-md hover:opacity-90 active:scale-95 transition flex items-center gap-1.5 whitespace-nowrap">
              <span>+</span>

        <!-- DYNAMIC BENTO VIEWPORT -->

  <script>
    /**
     * ============================================================================
     * DYNAMIC SYSTEM DATE HELPERS (NO HARDCODED DATES)
     * ============================================================================
     */
    function getLocalTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysToStr(baseStr, offsetDays) {
      const [y, m, d] = baseStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    const TODAY_STR = getLocalTodayStr();
    const NOW_OBJ = new Date();

    const MONTH_NAMES_ID = [
      'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];
    const MONTH_SHORT_ID = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const DAY_NAMES_FULL_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const DAY_NAMES_SHORT_ID = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

    function formatHeaderFullDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return `${DAY_NAMES_FULL_ID[dt.getDay()]}, ${d} ${MONTH_SHORT_ID[m - 1]} ${y}`;
    }

    /**
     * ============================================================================
     * STRUCTURED APPLICATION STATE & GITHUB GIST CLOUD CONFIG
     * ============================================================================
     */

      'Sekolah': {
        emoji: '📘',
        pill: 'bg-[#E6EEF2] dark:bg-slate-800 text-[#2E5063] dark:text-sky-300',
        barColor: '#4A6B7C',
        dot: 'bg-[#4A6B7C]'
      },
      'OSIS': {
        emoji: '🟠',
        pill: 'bg-[#FDECE7] dark:bg-orange-950/60 text-[#C93B1B] dark:text-orange-300',
        barColor: '#FF5E3A',
        dot: 'bg-coral'
      },
      'Project': {
        emoji: '🟡',
        pill: 'bg-[#FEF6D8] dark:bg-amber-950/60 text-[#8F6B00] dark:text-amber-300',
        barColor: '#EAB308',
        dot: 'bg-solar'
      },
      'Rutin': {
        emoji: '🌿',
        pill: 'bg-[#E7F2EC] dark:bg-emerald-950/60 text-[#256343] dark:text-emerald-300',
        barColor: '#2E7D5B',
        dot: 'bg-emerald-600'
      }
    };

    const PRIORITY_STYLES = {
      'Tinggi': { label: 'Prioritas Tinggi', badge: 'bg-[#FDECE7] dark:bg-rose-950/70 text-[#C93B1B] dark:text-rose-300', weight: 3 },
      'Sedang': { label: 'Sedang', badge: 'bg-[#FEF6D8] dark:bg-amber-950/70 text-[#8F6B00] dark:text-amber-300', weight: 2 },
      'Rendah': { label: 'Santai', badge: 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300', weight: 1 }
    };

    function getInitialUrlGistId() {
      try {
        return new URLSearchParams(window.location.search).get('gist_id') || '';
      } catch (e) {
        return '';
      }
    }

    const state = {
      currentTab: 'today',
      selectedCalendarDate: TODAY_STR,
      calendarYear: NOW_OBJ.getFullYear(),
      calendarMonth: NOW_OBJ.getMonth(), // 0-11
      dailyFocusGoal: 5,
      focusHoursToday: 3.5,
      taskFilterCategory: 'Semua',
      taskFilterStatus: 'active',
      searchQuery: '',
      notifiedTaskIds: [],

      // GitHub Gist API Cloud Sync State (Zero localStorage)
      gist: {
        token: '',
        gistId: getInitialUrlGistId(),
        filename: 'plan_os_data.json',
        autoSync: true,
        status: 'offline', // 'offline' | 'syncing' | 'synced' | 'error'
        lastSyncedAt: '',
        lastError: ''
      },

      tasks: [
        {
          id: 't1',
          title: 'Proposal & Rundown Classmeet',
          category: 'OSIS',
          priority: 'Tinggi',
          deadlineDate: addDaysToStr(TODAY_STR, 1),
          deadlineTime: '15:00',
          reminder: '1 hari sebelum',
          notes: 'Minta tanda tangan pembina OSIS sebelum jam 3 sore di ruang guru.',
          completed: false,
          subtasks: [
            { id: 's1', text: 'Buat konsep lomba antar kelas', done: true },
            { id: 's2', text: 'Hitung estimasi anggaran hadiah', done: true },
            { id: 's3', text: 'Susun jadwal pertandingan per jam', done: false },
            { id: 's4', text: 'Revisi bareng ketua panitia', done: false }
          ]
        },
        {
          id: 't2',
          title: 'Latihan Soal Fisika Dinamika Rotasi',
          category: 'Sekolah',
          priority: 'Sedang',
          deadlineDate: TODAY_STR,
          deadlineTime: '21:00',
          reminder: '1 jam sebelum',
          notes: 'Kerjakan LKS halaman 42 nomor 1 sampai 10 beserta caranya.',
          completed: false,
          subtasks: [
            { id: 's5', text: 'Rangkum rumus momen inersia', done: true },
            { id: 's6', text: 'Kerjakan soal nomor 1–5', done: false },
            { id: 's7', text: 'Kerjakan soal nomor 6–10', done: false }

        {

          priority: 'Rendah',
          deadlineDate: TODAY_STR,
          deadlineTime: '19:30',
          reminder: 'Tanpa pengingat',
          notes: 'Pastikan tampilan mobile responsif sudah dicek.',

    let autoSyncTimer = null;

    function buildSerializableData() {
      return {
        version: '2.0',
        updatedAt: new Date().toISOString(),
        dailyFocusGoal: state.dailyFocusGoal,
        focusHoursToday: state.focusHoursToday,
        tasks: state.tasks,
        schedules: state.schedules,
        subjects: state.subjects
      };
    }

    function applyImportedData(data) {
      if (!data || typeof data !== 'object') throw new Error('Format data tidak valid');
      if (Array.isArray(data.tasks)) state.tasks = data.tasks;
      if (Array.isArray(data.schedules)) state.schedules = data.schedules;
      if (Array.isArray(data.subjects)) state.subjects = data.subjects;
      if (typeof data.dailyFocusGoal === 'number') state.dailyFocusGoal = data.dailyFocusGoal;
      if (typeof data.focusHoursToday === 'number') state.focusHoursToday = data.focusHoursToday;
    }

    function updateUrlGistParam(gistId) {
      if (!gistId) return;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('gist_id', gistId);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {
        // Ignore in restricted iframe contexts
      }
    }

    function updateSyncIndicators() {
      const subEl = document.getElementById('header-date-subtitle');
      const deskDot = document.getElementById('desk-sync-dot');
      const mobDot = document.getElementById('mob-sync-dot');

      let syncLabel = '☁️ Mode Sesi (Belum terhubung Gist)';
      let dotClass = 'bg-stone-400';

      if (state.gist.status === 'syncing') {
        syncLabel = '🔄 Menyinkronkan ke GitHub Gist...';
        dotClass = 'bg-solar animate-pulse';
      } else if (state.gist.status === 'synced') {
        syncLabel = `☁️ Gist Tersinkron (${state.gist.lastSyncedAt})`;
        dotClass = 'bg-emerald-500';
      } else if (state.gist.status === 'error') {
        syncLabel = '⚠️ Gagal Sinkron Gist';
        dotClass = 'bg-coral';
      } else if (state.gist.gistId) {
        syncLabel = `☁️ Gist ID: ${state.gist.gistId.slice(0, 8)}...`;
        dotClass = 'bg-sky-500';
      }

      if (subEl) {
        subEl.innerHTML = `${formatHeaderFullDate(TODAY_STR)} • <button onclick="openCloudSyncModal()" class="underline decoration-dotted hover:text-obsidian dark:hover:text-white transition">${syncLabel}</button>`;
      }
      if (deskDot) deskDot.className = `absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full ${dotClass} ring-2 ring-white dark:ring-[#1C1E24]`;
      if (mobDot) mobDot.className = `absolute top-1 right-1.5 w-2 h-2 rounded-full ${dotClass}`;
    }

    function triggerAutoSync() {
      if (!state.gist.autoSync || !state.gist.token) return;
      clearTimeout(autoSyncTimer);
      autoSyncTimer = setTimeout(() => {
        syncPushToGist(false);
      }, 1200);
    }

    async function syncPushToGist(isManual = true) {
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();
      if (!token) {
        if (isManual) showToast('Masukkan GitHub Personal Access Token dulu!', 'error');
        return;
      }

      state.gist.status = 'syncing';
      state.gist.lastError = '';
      updateSyncIndicators();

      const payload = {
        description: 'Plan.os — Personal Command Center Pelajar & OSIS',
        public: false,
        files: {
          [state.gist.filename]: {
            content: JSON.stringify(buildSerializableData(), null, 2)
          }
        }
      };

      try {
        const endpoint = gistId
          ? `https://api.github.com/gists/${encodeURIComponent(gistId)}`
          : 'https://api.github.com/gists';
        const method = gistId ? 'PATCH' : 'POST';

        const res = await fetch(endpoint, {
          method,
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || `HTTP ${res.status}`);
        }

        if (data.id) {
          state.gist.gistId = data.id;
          updateUrlGistParam(data.id);
        }

        const now = new Date();
        state.gist.status = 'synced';
        state.gist.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        updateSyncIndicators();

        if (isManual) {
          showToast(gistId ? 'Berhasil disimpan ke GitHub Gist!' : 'Secret Gist baru dibuat & tersinkron!');
          if (document.getElementById('gist-id-input')) {
            openCloudSyncModal();
          }
        }
      } catch (err) {
        state.gist.status = 'error';
        state.gist.lastError = err.message || 'Gagal terhubung ke GitHub API';
        updateSyncIndicators();
        if (isManual) {
          showToast(`Gagal sync: ${state.gist.lastError}`, 'error');
          if (document.getElementById('gist-id-input')) {
            openCloudSyncModal();
          }
        }
      }
    }

    async function syncPullFromGist(isManual = true) {
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();
      if (!gistId) {
        if (isManual) showToast('Isi Gist ID terlebih dahulu untuk menarik data!', 'error');
        return;
      }

      state.gist.status = 'syncing';
      state.gist.lastError = '';
      updateSyncIndicators();

      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, { headers });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || `HTTP ${res.status}`);
        }

        const files = data.files || {};
        const targetFile = files[state.gist.filename] || Object.values(files).find(f => f && f.filename && f.filename.endsWith('.json'));
        if (!targetFile || !targetFile.content) {
          throw new Error('File JSON tidak ditemukan di dalam Gist tersebut');
        }

        const parsed = JSON.parse(targetFile.content);
        applyImportedData(parsed);
        updateUrlGistParam(gistId);

        const now = new Date();
        state.gist.status = 'synced';
        state.gist.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        updateSyncIndicators();
        renderApp();

        if (isManual) {
          closeModal();
          showToast('Data berhasil dimuat dari GitHub Gist!');
        }
      } catch (err) {
        state.gist.status = 'error';
        state.gist.lastError = err.message || 'Gagal mengambil data dari Gist';
        updateSyncIndicators();
        if (isManual) {
          showToast(`Gagal tarik data: ${state.gist.lastError}`, 'error');
          if (document.getElementById('gist-id-input')) {
            openCloudSyncModal();
          }
        }
      }
    }

    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatIndoDate(dateStr) {
      if (!dateStr) return '-';
      if (dateStr === TODAY_STR) return 'Hari ini';
      if (dateStr === addDaysToStr(TODAY_STR, 1)) return 'Besok';
      if (dateStr === addDaysToStr(TODAY_STR, -1)) return 'Kemarin';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return `${DAY_NAMES_SHORT_ID[d.getDay()]}, ${d.getDate()} ${MONTH_SHORT_ID[d.getMonth()]}`;
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `${type === 'error' ? 'bg-coral text-white' : 'bg-obsidian dark:bg-white text-white dark:text-obsidian'} px-4 py-2.5 rounded-full shadow-xl text-xs font-bold flex items-center gap-2 animate-fade-in`;
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✨'}</span><span>${escapeHtml(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
      }, 2400);
    }

    // Dynamic Multi-Month Obsidian Calendar Renderer (Monday-first grid)
    function renderObsidianCalendarDays() {
      const year = state.calendarYear;
      const month = state.calendarMonth; // 0-11
      const firstDayJs = new Date(year, month, 1).getDay(); // 0=Sun..6=Sat
      const mondayOffset = (firstDayJs + 6) % 7; // 0=Mon..6=Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const completedDates = new Set(state.tasks.filter(t => t.completed).map(t => t.deadlineDate));
      const scheduledDates = new Set([
        ...state.schedules.map(s => s.date),
        ...state.tasks.filter(t => !t.completed).map(t => t.deadlineDate)
      ]);

      let cells = '';
      for (let e = 0; e < mondayOffset; e++) {
        cells += `<span></span>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isSelected = dateStr === state.selectedCalendarDate;
        const isToday = dateStr === TODAY_STR;
        const hasDone = completedDates.has(dateStr);
        const hasSched = scheduledDates.has(dateStr);

        let cls = 'w-7 h-7 mx-auto rounded-full flex items-center justify-center font-semibold transition cursor-pointer ';
        if (hasDone && !isSelected) {
          cls += 'bg-solar text-obsidian font-extrabold shadow-xs';
        } else if (isSelected) {
          cls += 'ring-2 ring-white bg-white/15 text-white font-extrabold';
        } else if (hasSched) {
          cls += 'bg-[#2B3028] text-stone-200 border border-[#495240]';
        } else if (isToday) {
          cls += 'border border-stone-400 text-white font-bold';
        } else {
          cls += 'text-stone-400 hover:bg-stone-800';
        }

        cells += `<button onclick="selectCalendarDay('${dateStr}')" class="${cls}">${day}</button>`;
      }
      return cells;
    }

    function changeCalendarMonth(delta) {
      let m = state.calendarMonth + delta;
      let y = state.calendarYear;
      if (m < 0) {
        m = 11;
        y -= 1;
      } else if (m > 11) {
        m = 0;
        y += 1;
      }
      state.calendarMonth = m;
      state.calendarYear = y;
      renderApp();
    }

    function selectCalendarDay(dateStr) {
      state.selectedCalendarDate = dateStr;
      const [y, m] = dateStr.split('-').map(Number);
      state.calendarYear = y;
      state.calendarMonth = m - 1;
      renderApp();
    }

        .filter(t => {
          const matchStatus = state.taskFilterStatus === 'active' ? !t.completed : t.completed;
          const matchCat = state.taskFilterCategory === 'Semua' || t.category === state.taskFilterCategory;

    function toggleTaskDone(taskId, e) {
      if (e) e.stopPropagation();
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.completed = !t.completed;
      if (t.completed && t.subtasks.length > 0) {
        t.subtasks.forEach(s => s.done = true);
      }
      renderApp();
      triggerAutoSync();
      showToast(t.completed ? `Selesai: ${t.title}` : 'Tugas dibuka kembali');
    }

    function saveNewTask(e) {
      e.preventDefault();
      const title = document.getElementById('inp-task-title').value.trim();
      const category = document.getElementById('inp-task-cat').value;
      const priority = document.getElementById('inp-task-prio').value;
      const deadlineDate = document.getElementById('inp-task-date').value;
      const deadlineTime = document.getElementById('inp-task-time').value;
      const reminder = document.getElementById('inp-task-reminder').value;
      const subsRaw = document.getElementById('inp-task-subs').value;
      const notes = document.getElementById('inp-task-notes').value.trim();

      const subtasks = subsRaw
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(text => ({ id: generateId('sub'), text, done: false }));

      state.tasks.unshift({
        id: generateId('t'),
        title,
        category,
        priority,
        deadlineDate,
        deadlineTime,
        reminder,
        notes,
        completed: false,
        subtasks
      });

      closeModal();
      renderApp();
      triggerAutoSync();
      showToast('Tugas baru ditambahkan!');
    }

    function toggleSubtask(taskId, subId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const s = t.subtasks.find(x => x.id === subId);
      if (!s) return;
      s.done = !s.done;
      if (t.subtasks.length > 0 && t.subtasks.every(x => x.done)) {
        t.completed = true;
      } else {
        t.completed = false;
      }
      renderApp();
      triggerAutoSync();
      openTaskDetailModal(taskId);
    }

    function addSubtask(taskId) {
      const inp = document.getElementById('modal-sub-inp');
      if (!inp || !inp.value.trim()) return;
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.subtasks.push({ id: generateId('s'), text: inp.value.trim(), done: false });
      t.completed = false;
      renderApp();
      triggerAutoSync();
      openTaskDetailModal(taskId);
    }

    function deleteSubtask(taskId, subId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.subtasks = t.subtasks.filter(s => s.id !== subId);
      renderApp();
      triggerAutoSync();
      openTaskDetailModal(taskId);
    }

    function deleteTaskById(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      closeModal();
      renderApp();
      triggerAutoSync();
      showToast('Tugas dihapus');
    }

                ${['📐', '⚡', '💻', '🏛️', '🧪', '🧬', '🗣️', '📊', '📚'].map(ic => `<option value="${ic}" ${sub.icon === ic ? 'selected' : ''}>${ic} Ikon Mapel</option>`).join('')}
              </select>
              <div class="flex gap-2 pt-2">
                <button type="button" onclick="openSubjectDetailModal('${sub.id}')" class="flex-1 py-2.5 rounded-full bg-[#F3F1ED] dark:bg-stone-800 text-xs font-bold">Batal</button>
                <button type="submit" class="flex-[2] py-2.5 rounded-full bg-obsidian dark:bg-solar text-white dark:text-obsidian text-xs font-extrabold">Simpan ✓</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function saveEditedSubject(e, subId) {
      e.preventDefault();
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      sub.name = document.getElementById('edit-sub-name').value.trim();
      sub.teacher = document.getElementById('edit-sub-teacher').value.trim();
      sub.icon = document.getElementById('edit-sub-icon').value;
      renderApp();
      triggerAutoSync();
      openSubjectDetailModal(subId);
      showToast('Info mapel diperbarui!');
    }

    function deleteSubjectById(subId) {
      state.subjects = state.subjects.filter(s => s.id !== subId);
      closeModal();
      renderApp();
      triggerAutoSync();
      showToast('Mata pelajaran dihapus');
    }

    function openEditChapterModal(subId, chapId) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const chap = sub.chapters.find(c => c.id === chapId);
      if (!chap) return;

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-obsidian/60 backdrop-blur-xs flex items-end md:items-center justify-center animate-fade-in p-0 md:p-4">
          <div class="w-full max-w-md bg-white dark:bg-[#1C1E24] rounded-t-[30px] md:rounded-[30px] p-5 shadow-2xl border border-stone-200 dark:border-stone-800 animate-slide-up">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-base font-display font-extrabold">✎ Edit Bab & Catatan</h3>
              <button onclick="deleteChapterById('${sub.id}', '${chap.id}')" class="px-3 py-1 rounded-full bg-[#FDECE7] dark:bg-rose-950/60 text-coral text-xs font-bold">Hapus Bab</button>
            </div>
            <form onsubmit="saveEditedChapter(event, '${sub.id}', '${chap.id}')" class="space-y-3">
              <div>
                <label class="block text-xs font-bold mb-1">Judul Bab</label>
                <input id="edit-ch-title" type="text" required value="${escapeHtml(chap.title)}" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Status Pemahaman</label>
                <select id="edit-ch-status" class="w-full px-3 py-2.5 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm">
                  <option value="belum" ${chap.status === 'belum' ? 'selected' : ''}>⚪ Belum Dipelajari</option>
                  <option value="review" ${chap.status === 'review' ? 'selected' : ''}>🟡 Perlu Review</option>
                  <option value="paham" ${chap.status === 'paham' ? 'selected' : ''}>🟢 Sudah Paham</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Catatan Ringkas / Rumus</label>
                <textarea id="edit-ch-note" rows="3" class="w-full px-3.5 py-2 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm">${escapeHtml(chap.note || '')}</textarea>
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" onclick="openSubjectDetailModal('${sub.id}')" class="flex-1 py-2.5 rounded-full bg-[#F3F1ED] dark:bg-stone-800 text-xs font-bold">Batal</button>
                <button type="submit" class="flex-[2] py-2.5 rounded-full bg-obsidian dark:bg-solar text-white dark:text-obsidian text-xs font-extrabold">Simpan ✓</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function saveEditedChapter(e, subId, chapId) {
      e.preventDefault();
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const chap = sub.chapters.find(c => c.id === chapId);
      if (!chap) return;
      chap.title = document.getElementById('edit-ch-title').value.trim();
      chap.status = document.getElementById('edit-ch-status').value;
      chap.note = document.getElementById('edit-ch-note').value.trim();
      renderApp();
      triggerAutoSync();
      openSubjectDetailModal(subId);
      showToast('Bab materi diperbarui!');
    }

    function deleteChapterById(subId, chapId) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      sub.chapters = sub.chapters.filter(c => c.id !== chapId);
      renderApp();
      triggerAutoSync();
      openSubjectDetailModal(subId);
      showToast('Bab dihapus');
    }

    function cycleChapter(subId, chapId) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const chap = sub.chapters.find(c => c.id === chapId);
      if (!chap) return;
      const order = ['belum', 'review', 'paham'];
      chap.status = order[(order.indexOf(chap.status) + 1) % order.length];
      renderApp();
      triggerAutoSync();
      openSubjectDetailModal(subId);
    }

    function addChapterInline(e, subId) {
      e.preventDefault();
      const t = document.getElementById('inline-ch-title').value.trim();
      const n = document.getElementById('inline-ch-note').value.trim();
      if (!t) return;
      const sub = state.subjects.find(s => s.id === subId);
      if (sub) sub.chapters.push({ id: generateId('c'), title: t, status: 'belum', note: n });
      renderApp();
      triggerAutoSync();
      openSubjectDetailModal(subId);
    }

    function openAddSubjectModal() {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-obsidian/60 backdrop-blur-xs flex items-end md:items-center justify-center animate-fade-in p-0 md:p-4">
          <div class="w-full max-w-md bg-white dark:bg-[#1C1E24] rounded-t-[30px] md:rounded-[30px] p-5 shadow-2xl border border-stone-200 dark:border-stone-800 animate-slide-up">
            <h3 class="text-base font-display font-extrabold mb-3">Tambah Mata Pelajaran</h3>
            <form onsubmit="createSubject(event)" class="space-y-3">
              <input id="sub-name" type="text" required placeholder="Nama Mata Pelajaran (mis. Kimia)" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm" />
              <input id="sub-teacher" type="text" placeholder="Keterangan (mis. Guru: Bu Rina • Kelas XI)" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm" />
              <select id="sub-icon" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm">
                <option value="🧪">🧪 Kimia / Sains</option>
                <option value="🧬">🧬 Biologi</option>
                <option value="🗣️">🗣️ Bahasa Inggris / Indonesia</option>
                <option value="📊">📊 Ekonomi</option>
                <option value="📚">📚 Mata Pelajaran Umum</option>
              </select>
              <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-full bg-[#F3F1ED] dark:bg-stone-800 text-xs font-bold">Batal</button>
                <button type="submit" class="flex-[2] py-2.5 rounded-full bg-obsidian dark:bg-solar text-white dark:text-obsidian text-xs font-extrabold">Tambah Mapel</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function createSubject(e) {
      e.preventDefault();
      const name = document.getElementById('sub-name').value.trim();
      const teacher = document.getElementById('sub-teacher').value.trim();
      const icon = document.getElementById('sub-icon').value;
      if (!name) return;
      state.subjects.push({ id: generateId('sub'), name, teacher, icon, chapters: [] });
      closeModal();
      renderApp();
      triggerAutoSync();
      showToast(`Mapel ${name} ditambahkan!`);
    }

    /**
     * ============================================================================
     * REMINDERS & WEB NOTIFICATION API
     * ============================================================================
     */
    function requestBrowserNotifications() {
      if (typeof Notification === 'undefined') {
        showToast('Browser ini tidak mendukung notifikasi sistem', 'error');
        return;
      }
      try {
        Notification.requestPermission().then(perm => {
          if (perm === 'granted') {
            showToast('Notifikasi pengingat diaktifkan!');
            openRemindersModal();
          } else {
            showToast('Izin notifikasi ditolak browser', 'error');
          }
        });
      } catch (e) {
        showToast('Notifikasi dibatasi oleh mode preview', 'error');
      }
    }

    function checkUpcomingDeadlines() {
      const now = new Date();
      state.tasks.forEach(t => {
        if (t.completed || !t.reminder || t.reminder === 'Tanpa pengingat') return;
        if (state.notifiedTaskIds.includes(t.id)) return;

        const [y, m, d] = t.deadlineDate.split('-').map(Number);
        const [hh, mm] = t.deadlineTime.split(':').map(Number);
        const due = new Date(y, m - 1, d, hh, mm);
        const diffMinutes = (due - now) / 60000;

        let threshold = 60;
        if (t.reminder === '15 menit sebelum') threshold = 15;
        else if (t.reminder === '1 hari sebelum') threshold = 1440;

        if (diffMinutes > 0 && diffMinutes <= threshold) {
          state.notifiedTaskIds.push(t.id);
          showToast(`⏰ Pengingat: ${t.title} (${t.deadlineTime})`);
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            try {
              new Notification(`Deadline ${t.category}: ${t.title}`, {
                body: `Tenggat pukul ${t.deadlineTime} (${formatIndoDate(t.deadlineDate)})`
              });
            } catch (e) {}
          }
        }
      });
    }

    function openRemindersModal() {
      const urgent = state.tasks.filter(t => !t.completed);
      const notifSupported = typeof Notification !== 'undefined';
      const notifGranted = notifSupported && Notification.permission === 'granted';

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-obsidian/60 backdrop-blur-xs flex items-end md:items-center justify-center animate-fade-in p-0 md:p-4">
          <div class="w-full max-w-md bg-white dark:bg-[#1C1E24] rounded-t-[30px] md:rounded-[30px] p-5 shadow-2xl border border-stone-200 dark:border-stone-800 animate-slide-up">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-base font-display font-extrabold">🔔 Pengingat Tenggat Waktu</h3>
              <button onclick="closeModal()" class="text-xs font-bold text-stone-400">Tutup</button>
            </div>

            ${notifSupported && !notifGranted ? `
              <button onclick="requestBrowserNotifications()" class="w-full mb-3 py-2.5 px-4 rounded-2xl bg-[#FEF6D8] dark:bg-amber-950/60 text-[#8F6B00] dark:text-amber-300 text-xs font-bold flex items-center justify-between">
                <span>🔔 Aktifkan Notifikasi Pengingat HP</span>
                <span>Izinkan &rsaquo;</span>
              </button>
            ` : notifGranted ? `
              <div class="mb-3 py-2 px-3 rounded-2xl bg-[#E7F2EC] dark:bg-emerald-950/50 text-[#256343] dark:text-emerald-300 text-[11px] font-bold">
                ✅ Notifikasi Pengingat Browser Aktif
              </div>
            ` : ''}

            <div class="space-y-2 max-h-72 overflow-y-auto">
              ${urgent.length === 0 ? `<p class="text-xs text-stone-400 text-center py-4">Semua tugas sudah selesai!</p>` : urgent.map(t => `
                <div onclick="openTaskDetailModal('${t.id}')" class="p-3 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 cursor-pointer">
                  <div class="flex justify-between text-[11px] font-bold text-coral mb-0.5">
                    <span>${t.category} • ${t.reminder || '1 jam sebelum'}</span>
                    <span>${formatIndoDate(t.deadlineDate)} ${t.deadlineTime}</span>
                  </div>
                  <p class="text-xs font-bold text-obsidian dark:text-white">${escapeHtml(t.title)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * CLOUD SYNC MODAL (GITHUB GIST API + MANUAL JSON FALLBACK)
     * ============================================================================
     */
    function openCloudSyncModal() {
      const jsonStr = JSON.stringify(buildSerializableData(), null, 2);
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-obsidian/60 backdrop-blur-xs flex items-end md:items-center justify-center animate-fade-in p-0 md:p-4">
          <div class="w-full max-w-md bg-white dark:bg-[#1C1E24] rounded-t-[30px] md:rounded-[30px] p-5 shadow-2xl border border-stone-200 dark:border-stone-800 max-h-[90vh] overflow-y-auto animate-slide-up">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-base font-display font-extrabold">☁️ Cloud Sync (GitHub Gist API)</h3>
              <button onclick="closeModal()" class="text-xs font-bold text-stone-400">Tutup</button>
            </div>
            <p class="text-xs text-stone-500 dark:text-stone-400 mb-3">
              Simpan data langsung ke <strong>Secret Gist</strong> akun GitHub-mu agar aman saat di-deploy di GitHub Pages (tanpa penyimpanan lokal browser).
            </p>

            ${state.gist.lastError ? `
              <div class="p-2.5 rounded-xl bg-[#FDECE7] dark:bg-rose-950/60 text-coral text-[11px] font-bold mb-3">
                ⚠️ ${escapeHtml(state.gist.lastError)}
              </div>
            ` : ''}

            <div class="space-y-2.5 mb-4">
              <div>
                <label class="block text-[11px] font-bold mb-1">GitHub Personal Access Token (scope: <code>gist</code>)</label>
                <input id="gist-token-input" type="password" value="${escapeHtml(state.gist.token)}" oninput="state.gist.token = this.value" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full px-3.5 py-2 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 font-mono text-xs" />
              </div>

              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="text-[11px] font-bold">Gist ID (Kosongkan untuk buat Gist baru)</label>
                  ${state.gist.gistId ? `<button type="button" onclick="copyGistBookmarkUrl()" class="text-[10px] font-bold text-slateTeal dark:text-solar underline">Salin Link Bookmark</button>` : ''}
                </div>
                <input id="gist-id-input" type="text" value="${escapeHtml(state.gist.gistId)}" oninput="state.gist.gistId = this.value" placeholder="Otomatis terisi setelah simpan pertama..." class="w-full px-3.5 py-2 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 font-mono text-xs" />
              </div>

              <label class="flex items-center gap-2 text-xs font-semibold pt-1 cursor-pointer">
                <input type="checkbox" ${state.gist.autoSync ? 'checked' : ''} onchange="state.gist.autoSync = this.checked" class="rounded accent-obsidian" />
                <span>Otomatis simpan ke Gist setiap ada perubahan</span>
              </label>

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button type="button" onclick="syncPushToGist(true)" class="py-2.5 rounded-full bg-obsidian dark:bg-solar text-white dark:text-obsidian text-xs font-extrabold shadow-sm">
                  ⬆️ Simpan ke Gist
                </button>
                <button type="button" onclick="syncPullFromGist(true)" class="py-2.5 rounded-full bg-[#E6EEF2] dark:bg-stone-700 text-[#2E5063] dark:text-white text-xs font-extrabold">
                  ⬇️ Tarik dari Gist
                </button>
              </div>
            </div>

            <details class="pt-3 border-t border-stone-200 dark:border-stone-800 text-xs">
              <summary class="font-bold cursor-pointer text-stone-500 hover:text-obsidian dark:hover:text-white">
                Cadangan JSON Manual (Opsional)
              </summary>
              <div class="mt-2.5 space-y-2">
                <textarea id="json-box" rows="4" class="w-full p-3 rounded-2xl bg-[#F7F5F0] dark:bg-stone-800 border border-stone-200 dark:border-stone-700 font-mono text-[10px]">${escapeHtml(jsonStr)}</textarea>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" onclick="copyJson()" class="py-2 rounded-full bg-stone-200 dark:bg-stone-700 text-xs font-bold">Salin JSON</button>
                  <button type="button" onclick="restoreJson()" class="py-2 rounded-full bg-solar text-obsidian text-xs font-extrabold">Muat JSON</button>
                </div>
              </div>
            </details>
          </div>
        </div>
      `;
    }

    function copyGistBookmarkUrl() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('gist_id', state.gist.gistId.trim());
        const temp = document.createElement('textarea');
        temp.value = url.toString();
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
        showToast('Link URL dengan Gist ID disalin!');
      } catch (e) {
        showToast('Gist ID: ' + state.gist.gistId);
      }
    }

    function copyJson() {
      const box = document.getElementById('json-box');
      if (!box) return;
      box.select();
      document.execCommand('copy');
      showToast('Data JSON berhasil disalin!');
    }

    function restoreJson() {
      const box = document.getElementById('json-box');
      if (!box) return;
      try {
        const data = JSON.parse(box.value);
        applyImportedData(data);
        closeModal();
        renderApp();
        triggerAutoSync();
        showToast('Data berhasil dipulihkan!');
      } catch (e) {
        showToast('Format JSON tidak valid!', 'error');
      }
    }

    /**
     * ============================================================================
     * RENDER CONTROLLER & STARTUP
     * ============================================================================
     */
    function renderApp() {
      updateSyncIndicators();
      const main = document.getElementById('main-content');
      if (!main) return;
      if (state.currentTab === 'today') main.innerHTML = renderDashboardTab();
      else if (state.currentTab === 'tasks') main.innerHTML = renderTasksTab();
      else if (state.currentTab === 'calendar') main.innerHTML = renderCalendarTab();
      else if (state.currentTab === 'lessons') main.innerHTML = renderLessonsTab();
    }

    window.onload = function () {
      switchTab('today');
      checkUpcomingDeadlines();
      setInterval(checkUpcomingDeadlines, 30000);

      // If opened with ?gist_id=... in URL, attempt initial pull automatically
      if (state.gist.gistId) {
        syncPullFromGist(false);
      }
    };
  </script>
</body>
</html>
