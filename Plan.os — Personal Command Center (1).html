<!DOCTYPE html>
<html lang="id" class="light">
<head>

  <meta name="theme-color" content="#EAE5DC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Plan.os — Personal Command Center</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Helvetica Neue"', 'system-ui', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Helvetica Neue"', 'system-ui', 'sans-serif'],
          },
          colors: {
            desertStone: '#C2BBB0',
            parchmentCanvas: '#EAE5DC',
            ivoryCard: '#FAF8F3',
            persianNavy: '#0F1D32',
            persianIndigo: '#172A46',
            antiqueGold: '#A88F59',
            champagneGold: '#D4B97A',
            sageOlive: '#4E6156',
            terracotta: '#B84A39',
            inkCharcoal: '#181816',

      }

  <style>
    :root {
      --spring-ease: cubic-bezier(0.32, 0.72, 0, 1);
      --spring-bounce: cubic-bezier(0.22, 1.15, 0.36, 1);
    }

    * {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, .sf-display {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
      letter-spacing: -0.022em;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* iOS 27 Liquid Glass Surface */
    .ios-glass {
      background: rgba(250, 248, 243, 0.78);
      backdrop-filter: blur(26px) saturate(185%);
      -webkit-backdrop-filter: blur(26px) saturate(185%);
      box-shadow:
        0 10px 30px -6px rgba(15, 29, 50, 0.14),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
    }

    .dark .ios-glass {
      background: rgba(16, 30, 51, 0.80);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      box-shadow:
        0 12px 32px -6px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 0 rgba(212, 185, 122, 0.18);
    }

    /* Tactile iOS Spring Press */
    .ios-tap {
      transition: transform 0.28s var(--spring-ease), background-color 0.25s ease, opacity 0.2s ease, box-shadow 0.28s var(--spring-ease);
    }
    .ios-tap:active {
      transform: scale(0.95);
    }

    /* Sliding Glider Pill in Navigation */
    #mob-nav-glider {
      transition: transform 0.4s var(--spring-ease), width 0.4s var(--spring-ease);
      will-change: transform, width;
    }

    /* Smooth View Transition */
    @keyframes iosViewEnter {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.992);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-ios-view {
      animation: iosViewEnter 0.34s var(--spring-ease) forwards;
    }

    /* iOS Bottom Sheet Slide Up */
    @keyframes iosSheetUp {
      0% {
        opacity: 0.4;
        transform: translateY(100%);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes iosBackdropIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .animate-ios-sheet {
      animation: iosSheetUp 0.38s var(--spring-ease) forwards;
    }
    .animate-ios-backdrop {
      animation: iosBackdropIn 0.25s ease-out forwards;
    }

    /* Persian Navy Hero Surface */
    .persian-hero-surface {
      background: linear-gradient(145deg, #0F1D32 0%, #162947 65%, #11223B 100%);
      box-shadow: 0 16px 36px -10px rgba(15, 29, 50, 0.35);
    }
  </style>

  <script>
    /**
     * ============================================================================
     * DATE & CALENDAR UTILITIES
     * ============================================================================
     */
    function getLocalTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function addDaysToStr(baseStr, offsetDays) {
      const [y, m, d] = baseStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + offsetDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    const TODAY_STR = getLocalTodayStr();
    const NOW_OBJ = new Date();
    const MONTH_NAMES_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const MONTH_SHORT_ID = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const DAY_NAMES_SHORT_ID = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

    function formatIndoDate(dateStr) {
      if (!dateStr) return '-';
      if (dateStr === TODAY_STR) return 'Hari ini';
      if (dateStr === addDaysToStr(TODAY_STR, 1)) return 'Besok';
      if (dateStr === addDaysToStr(TODAY_STR, -1)) return 'Kemarin';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return `${DAY_NAMES_SHORT_ID[d.getDay()]}, ${d.getDate()} ${MONTH_SHORT_ID[d.getMonth()]}`;
    }

    function getSchedulesForDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const targetDow = new Date(y, m - 1, d).getDay();
      return state.schedules.filter(s => {
        if (s.date === dateStr) return true;
        if (s.recurringWeekly) {
          const [oy, om, od] = s.date.split('-').map(Number);
          return new Date(oy, om - 1, od).getDay() === targetDow;
        }
        return false;
      });
    }

    function getCurrentWeekDates() {
      const now = new Date(NOW_OBJ.getFullYear(), NOW_OBJ.getMonth(), NOW_OBJ.getDate());
      const mondayOffset = (now.getDay() + 6) % 7;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - mondayOffset);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const dt = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        dates.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
      }
      return dates;
    }

    /**
     * ============================================================================
     * VECTOR ICON SYSTEM (ZERO EMOJI CLUTTER)
     * ============================================================================
     */
    const CATEGORY_META = {
      'Sekolah': {

        iconSvg: `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>`

    /**
     * ============================================================================
     * GITHUB GIST CLOUD SYNC ENGINE
     * ============================================================================
     */
    let autoSyncTimer = null;

    function buildSerializableData() {
      return {
        version: '3.1',
        updatedAt: new Date().toISOString(),
        profile: state.profile,
        tasks: state.tasks,
        schedules: state.schedules,
        subjects: state.subjects
      };
    }

    function applyImportedData(data) {
      if (!data || typeof data !== 'object') throw new Error('Format data tidak valid');
      if (data.profile && typeof data.profile === 'object') {
        state.profile = { ...state.profile, ...data.profile };
      }
      if (Array.isArray(data.tasks)) state.tasks = data.tasks;
      if (Array.isArray(data.schedules)) state.schedules = data.schedules;
      if (Array.isArray(data.subjects)) state.subjects = data.subjects;
    }

    function markDataChanged() {
      state.hasUnsyncedChanges = true;
      updateHeaderIdentity();
      if (state.gist.autoSync && state.gist.token.trim()) {
        clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => syncPushToGist(false), 1100);
      }
    }

    window.addEventListener('beforeunload', (e) => {
      if (state.hasUnsyncedChanges && !state.gist.token.trim()) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function updateUrlGistParam(gistId) {
      if (!gistId) return;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('gist_id', gistId);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    async function syncPushToGist(isManual = true) {
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();
      if (!token) {
        if (isManual) showToast('Isi Personal Access Token GitHub dulu', 'error');
        return;
      }

      state.gist.status = 'syncing';
      state.gist.lastError = '';
      updateHeaderIdentity();

      const payload = {
        description: `Plan.os — ${state.profile.fullName}`,
        public: false,
        files: {
          [state.gist.filename]: {
            content: JSON.stringify(buildSerializableData(), null, 2)
          }
        }
      };

      try {
        const endpoint = gistId ? `https://api.github.com/gists/${encodeURIComponent(gistId)}` : 'https://api.github.com/gists';
        const method = gistId ? 'PATCH' : 'POST';
        const res = await fetch(endpoint, {
          method,
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

        if (data.id) {
          state.gist.gistId = data.id;
          updateUrlGistParam(data.id);
        }
        const now = new Date();
        state.gist.status = 'synced';
        state.gist.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        state.hasUnsyncedChanges = false;
        updateHeaderIdentity();

        if (isManual) {
          showToast(gistId ? 'Tersimpan ke GitHub Gist' : 'Secret Gist baru berhasil dibuat');
          if (document.getElementById('gist-id-input')) openCloudSyncModal();
        }
      } catch (err) {
        state.gist.status = 'error';
        state.gist.lastError = err.message || 'Gagal terhubung ke GitHub';
        updateHeaderIdentity();
        if (isManual) {
          showToast(`Gagal sync: ${state.gist.lastError}`, 'error');
          if (document.getElementById('gist-id-input')) openCloudSyncModal();
        }
      }
    }

    async function syncPullFromGist(isManual = true) {
      const token = state.gist.token.trim();
      const gistId = state.gist.gistId.trim();
      if (!gistId) {
        if (isManual) showToast('Masukkan Gist ID untuk memuat data', 'error');
        return;
      }

      state.gist.status = 'syncing';
      state.gist.lastError = '';
      updateHeaderIdentity();

      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, { headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

        const files = data.files || {};
        const targetFile = files[state.gist.filename] || Object.values(files).find(f => f && f.filename && f.filename.endsWith('.json'));
        if (!targetFile || !targetFile.content) throw new Error('File JSON tidak ditemukan pada Gist ini');

        applyImportedData(JSON.parse(targetFile.content));
        updateUrlGistParam(gistId);

        const now = new Date();
        state.gist.status = 'synced';
        state.gist.lastSyncedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        state.hasUnsyncedChanges = false;
        renderApp();

        if (isManual) {
          closeModal();
          showToast('Data & profil berhasil dimuat');
        }
      } catch (err) {
        state.gist.status = 'error';
        state.gist.lastError = err.message || 'Gagal mengambil Gist';
        updateHeaderIdentity();
        if (isManual) {
          showToast(`Gagal memuat: ${state.gist.lastError}`, 'error');
          if (document.getElementById('gist-id-input')) openCloudSyncModal();
        }
      }
    }

    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getInitials(name) {
      const parts = (name || 'PL').trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

      el.className = `${bgCls} px-4 py-2.5 rounded-full shadow-xl text-xs font-semibold flex items-center gap-2 animate-ios-view`;
      const icon = type === 'error'
        ? `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`

      el.innerHTML = `${icon}<span>${escapeHtml(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';

      navBar.querySelectorAll('.mob-nav-btn').forEach(btn => {

      const completedTasks = state.tasks.filter(t => t.completed).length;
      const activeTasks = state.tasks.filter(t => !t.completed);
      const urgentCount = activeTasks.filter(t => t.priority === 'Tinggi').length;
      const osisCount = activeTasks.filter(t => t.category === 'OSIS').length + state.schedules.filter(s => s.category === 'OSIS').length;

      const goalVal = Math.max(state.profile.dailyTaskGoal, 1);
      const ringPct = Math.min(Math.round((completedTasks / goalVal) * 100), 100);
      const radius = 26;
      const circ = 2 * Math.PI * radius;
      const dashOffset = circ - (circ * (ringPct / 100));

      const todaySchedules = getSchedulesForDate(TODAY_STR)
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const priorityTasks = [...activeTasks]
        .sort((a, b) => PRIORITY_META[b.priority].weight - PRIORITY_META[a.priority].weight)
        .slice(0, 3);

      return `
        <div class="animate-ios-view space-y-5">
          <!-- 1. HERO COMMAND CARD (Deep Persian Navy + Antique Gold) -->
          <section class="persian-hero-surface text-ivoryCard rounded-[28px] p-5 border border-antiqueGold/30 relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 rounded-full border border-antiqueGold/15 pointer-events-none"></div>
            <div class="absolute -right-4 -top-4 w-28 h-28 rounded-full border border-antiqueGold/10 pointer-events-none"></div>

            <div class="flex items-center justify-between gap-4">
              <div class="min-w-0">
                <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-champagneGold uppercase tracking-wider">
                  <span class="w-1.5 h-1.5 rounded-full bg-champagneGold"></span>
                  Fokus Hari Ini • ${formatIndoDate(TODAY_STR)}
                </span>
                <h2 class="text-xl sm:text-2xl font-bold text-ivoryCard mt-1 tabular-nums">
                  ${completedTasks} dari ${goalVal} Target Tuntas
                </h2>
                <p class="text-xs text-[#C8C2B6] mt-1 line-clamp-1">
                  ${escapeHtml(state.profile.motto)}
                </p>
              </div>

              <!-- Crisp Circular Progress Ring -->
              <div class="relative w-16 h-16 flex-shrink-0 flex items-center justify-center">
                <svg class="w-16 h-16 -rotate-90" viewBox="0 0 64 64">
                  <circle cx="32" cy="32" r="${radius}" fill="none" stroke="rgba(243,239,230,0.14)" stroke-width="5" />
                  <circle cx="32" cy="32" r="${radius}" fill="none" stroke="#D4B97A" stroke-width="5" stroke-linecap="round"
                    stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}" class="transition-all duration-500" />
                </svg>
                <span class="absolute text-xs font-bold text-ivoryCard tabular-nums">${ringPct}%</span>
              </div>
            </div>

            <!-- 3 Clean Structured Metrics -->
            <div class="grid grid-cols-3 divide-x divide-ivoryCard/15 mt-5 pt-4 border-t border-ivoryCard/15 text-center">
              <button onclick="switchTab('tasks')" class="ios-tap px-2">
                <span class="block text-lg font-bold text-ivoryCard tabular-nums">${activeTasks.length}</span>
                <span class="block text-[11px] text-[#C2BBB0]">Tugas Aktif</span>
              </button>
              <button onclick="switchTab('calendar')" class="ios-tap px-2">
                <span class="block text-lg font-bold text-champagneGold tabular-nums">${osisCount}</span>
                <span class="block text-[11px] text-[#C2BBB0]">Agenda OSIS</span>
              </button>
              <button onclick="openFocusHoursModal()" class="ios-tap px-2">
                <span class="block text-lg font-bold text-ivoryCard tabular-nums">${state.profile.focusHoursToday}j</span>
                <span class="block text-[11px] text-[#C2BBB0]">Jam Belajar</span>
              </button>
            </div>
          </section>

          <!-- 2. AGENDA HARI INI -->
          <section>
            <div class="flex items-center justify-between mb-2.5">
              <h3 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Agenda Hari Ini</h3>
              <button onclick="switchTab('calendar')" class="ios-tap text-xs font-semibold text-persianNavy dark:text-champagneGold flex items-center gap-0.5">
                <span>Kalender</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>

            ${todaySchedules.length === 0 ? `
              <div class="p-4 rounded-[22px] bg-ivoryCard dark:bg-persianNavy/70 border border-desertStone/50 dark:border-persianIndigo flex items-center justify-between gap-2">
                <p class="text-xs text-[#6E695F] dark:text-stone-400">Tidak ada jadwal terikat hari ini.</p>
                <button onclick="openQuickAddModal('schedule')" class="ios-tap px-3 py-1.5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold whitespace-nowrap">+ Jadwal</button>
              </div>
            ` : `
              <div class="flex gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-1">
                ${todaySchedules.map(sch => {
                  const cat = CATEGORY_META[sch.category] || CATEGORY_META['Sekolah'];
                  return `
                    <div onclick="switchTab('calendar')" class="ios-tap snap-start min-w-[235px] sm:min-w-[255px] flex-1 p-3.5 rounded-[22px] bg-ivoryCard dark:bg-persianNavy/80 border border-desertStone/55 dark:border-persianIndigo flex flex-col justify-between gap-2.5 cursor-pointer">
                      <div class="flex items-center justify-between">
                        <span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${cat.badge}">
                          ${cat.iconSvg}
                          <span>${sch.category}</span>
                        </span>
                        <span class="text-[11px] font-bold text-[#666157] dark:text-stone-300 tabular-nums">${sch.startTime} – ${sch.endTime}</span>
                      </div>
                      <div>
                        <h4 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard truncate">${escapeHtml(sch.title)}</h4>
                        <p class="text-[11px] text-[#6E695F] dark:text-stone-400 truncate mt-0.5">${escapeHtml(sch.location)}</p>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <!-- 3. PRIORITAS UTAMA (Focused Top 3 Tasks) -->
          <section>
            <div class="flex items-center justify-between mb-2.5">
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Prioritas Dikerjakan</h3>
                ${urgentCount > 0 ? `<span class="px-2 py-0.5 rounded-full bg-[#F5E4E1] dark:bg-[#3A1E1B] text-terracotta dark:text-[#F09A8E] text-[10px] font-bold tabular-nums">${urgentCount} Mendesak</span>` : ''}
              </div>
              <button onclick="switchTab('tasks')" class="ios-tap text-xs font-semibold text-persianNavy dark:text-champagneGold flex items-center gap-0.5">
                <span>Semua (${activeTasks.length})</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>

            <div class="space-y-2.5">
              ${priorityTasks.length === 0 ? `
                <div class="p-6 rounded-[22px] bg-ivoryCard dark:bg-persianNavy/70 border border-desertStone/50 dark:border-persianIndigo text-center">
                  <p class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Semua tugas telah tuntas</p>
                  <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1">Ketuk tombol + untuk mencatat target berikutnya.</p>
                </div>
              ` : priorityTasks.map(task => renderTaskCard(task)).join('')}
            </div>
          </section>

          <!-- 4. PROGRES MATERI RINGKAS -->
          <section>
            <div class="flex items-center justify-between mb-2.5">
              <h3 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Penguasaan Materi</h3>
              <button onclick="switchTab('lessons')" class="ios-tap text-xs font-semibold text-persianNavy dark:text-champagneGold flex items-center gap-0.5">
                <span>Detail Mapel</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              ${state.subjects.slice(0, 3).map(sub => {
                const total = sub.chapters.length;
                const paham = sub.chapters.filter(c => c.status === 'paham').length;
                const pct = total > 0 ? Math.round((paham / total) * 100) : 0;
                const icon = SUBJECT_ICONS[sub.iconKey] || SUBJECT_ICONS.math;
                return `
                  <div onclick="openSubjectDetailModal('${sub.id}')" class="ios-tap p-3.5 rounded-[22px] bg-ivoryCard dark:bg-persianNavy/80 border border-desertStone/55 dark:border-persianIndigo cursor-pointer">
                    <div class="flex items-center justify-between mb-2">
                      <div class="w-8 h-8 rounded-xl bg-parchmentCanvas dark:bg-persianIndigo text-persianNavy dark:text-champagneGold flex items-center justify-center">
                        ${icon.svg}
                      </div>
                      <span class="text-xs font-bold text-persianNavy dark:text-champagneGold tabular-nums">${pct}%</span>
                    </div>
                    <h4 class="text-xs font-bold text-inkCharcoal dark:text-ivoryCard truncate">${escapeHtml(sub.name)}</h4>
                    <div class="w-full h-1.5 bg-parchmentCanvas dark:bg-persianIndigo rounded-full overflow-hidden mt-2">
                      <div class="h-full bg-persianNavy dark:bg-champagneGold rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // Reusable Clean Task Card
    function renderTaskCard(task) {
      const cat = CATEGORY_META[task.category] || CATEGORY_META['Sekolah'];
      const prio = PRIORITY_META[task.priority] || PRIORITY_META['Sedang'];
      const subTotal = task.subtasks.length;
      const subDone = task.subtasks.filter(s => s.done).length;

      return `
        <div onclick="openTaskDetailModal('${task.id}')" class="ios-tap p-3.5 rounded-[22px] bg-ivoryCard dark:bg-persianNavy/85 border border-desertStone/55 dark:border-persianIndigo border-l-4 ${cat.accentBorder} flex items-center justify-between gap-3 cursor-pointer ${task.completed ? 'opacity-60' : ''}">
          <div class="flex items-start gap-3 min-w-0">
            <button onclick="toggleTaskDone('${task.id}', event)" aria-label="Tandai selesai" class="ios-tap mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${task.completed ? 'bg-persianNavy dark:bg-champagneGold border-persianNavy dark:border-champagneGold text-ivoryCard dark:text-persianNavy' : 'border-desertStone dark:border-stone-500 bg-transparent'}">
              ${task.completed ? `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
            </button>
            <div class="min-w-0">
              <div class="flex items-center flex-wrap gap-1.5 mb-1">
                <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${cat.badge}">
                  ${cat.iconSvg}
                  <span>${task.category}</span>
                </span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${prio.badge}">${prio.label}</span>
              </div>
              <h4 class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard truncate ${task.completed ? 'line-through' : ''}">
                ${escapeHtml(task.title)}
              </h4>
              <p class="text-[11px] text-[#6E695F] dark:text-stone-400 mt-0.5 tabular-nums">
                ${formatIndoDate(task.deadlineDate)} • ${task.deadlineTime}
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            ${subTotal > 0 ? `
              <span class="px-2 py-1 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-[10px] font-bold text-persianNavy dark:text-champagneGold tabular-nums">
                ${subDone}/${subTotal}
              </span>
            ` : ''}
            <svg class="w-4 h-4 text-[#8D867B]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * TAB 2: TUGAS & SUBTASK (WITH INTEGRATED SEARCH)
     * ============================================================================
     */
    function renderTasksTab() {
      const categories = ['Semua', 'Sekolah', 'OSIS', 'Project', 'Rutin'];
      const activeCount = state.tasks.filter(t => !t.completed).length;
      const doneCount = state.tasks.filter(t => t.completed).length;

      const filtered = state.tasks
        .filter(t => {
          const matchStatus = state.taskFilterStatus === 'active' ? !t.completed : t.completed;
          const matchCat = state.taskFilterCategory === 'Semua' || t.category === state.taskFilterCategory;
          const q = state.searchQuery.toLowerCase();
          const matchSearch = !q || t.title.toLowerCase().includes(q) || (t.notes && t.notes.toLowerCase().includes(q));
          return matchStatus && matchCat && matchSearch;
        })
        .sort((a, b) => PRIORITY_META[b.priority].weight - PRIORITY_META[a.priority].weight);

      return `
        <div class="animate-ios-view space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-bold text-inkCharcoal dark:text-ivoryCard">Daftar Tugas</h2>
              <p class="text-xs text-[#6E695F] dark:text-stone-400">Ketuk tugas untuk memecah langkah kerja</p>
            </div>
            <button onclick="openQuickAddModal('task')" class="ios-tap px-4 py-2 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">
              + Tugas
            </button>
          </div>

          <!-- Search Input Placed Contextually Inside Tasks Tab -->
          <div class="relative">
            <input
              type="text"
              value="${escapeHtml(state.searchQuery)}"
              oninput="state.searchQuery = this.value; renderApp();"
              placeholder="Cari judul tugas atau catatan..."
              class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-ivoryCard dark:bg-persianNavy border border-desertStone/60 dark:border-persianIndigo text-xs font-medium focus:outline-none focus:ring-2 focus:ring-persianNavy dark:focus:ring-champagneGold"
            />
            <svg class="w-4 h-4 text-[#7E786E] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>

          <!-- Category Filter Chips -->
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5">
            ${categories.map(cat => {
              const isSelected = state.taskFilterCategory === cat;
              return `
                <button onclick="state.taskFilterCategory = '${cat}'; renderApp();" class="ios-tap px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${isSelected ? 'bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy shadow-2xs' : 'bg-ivoryCard dark:bg-persianNavy/70 text-[#5C574E] dark:text-stone-300 border border-desertStone/50 dark:border-persianIndigo'}">
                  ${cat}
                </button>
              `;
            }).join('')}
          </div>

          <!-- iOS Segmented Control -->
          <div class="grid grid-cols-2 p-1 rounded-2xl bg-desertStone/35 dark:bg-persianNavy border border-desertStone/40 dark:border-persianIndigo">
            <button onclick="state.taskFilterStatus = 'active'; renderApp();" class="ios-tap py-1.5 rounded-xl text-xs font-bold transition ${state.taskFilterStatus === 'active' ? 'bg-ivoryCard dark:bg-persianIndigo text-persianNavy dark:text-ivoryCard shadow-2xs' : 'text-[#635E54] dark:text-stone-400'}">
              Aktif (${activeCount})
            </button>
            <button onclick="state.taskFilterStatus = 'completed'; renderApp();" class="ios-tap py-1.5 rounded-xl text-xs font-bold transition ${state.taskFilterStatus === 'completed' ? 'bg-ivoryCard dark:bg-persianIndigo text-persianNavy dark:text-ivoryCard shadow-2xs' : 'text-[#635E54] dark:text-stone-400'}">
              Selesai (${doneCount})
            </button>
          </div>

          <!-- Task List -->
          <div class="space-y-2.5">
            ${filtered.length === 0 ? `
              <div class="p-8 rounded-[24px] bg-ivoryCard dark:bg-persianNavy/70 border border-desertStone/50 dark:border-persianIndigo text-center">
                <p class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Tidak ada tugas di kategori ini</p>
                <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1">Gunakan filter lain atau buat catatan tugas baru.</p>
              </div>
            ` : filtered.map(t => renderTaskCard(t)).join('')}
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * TAB 3: KALENDER & JADWAL (WITH RECURRING WEEKLY SUPPORT)
     * ============================================================================
     */
    function renderCalendarTab() {
      const selDate = state.selectedCalendarDate;
      const daySchedules = getSchedulesForDate(selDate);
      const dayTasks = state.tasks.filter(t => t.deadlineDate === selDate);
      const calMonthFullLabel = `${MONTH_NAMES_ID[state.calendarMonth]} ${state.calendarYear}`;

      const timeline = [
        ...daySchedules.map(s => ({
          type: 'schedule',
          time: s.startTime,
          endTime: s.endTime,
          title: s.title,
          subtitle: s.recurringWeekly ? `${s.location} • Rutin Mingguan` : s.location,
          category: s.category,
          id: s.id
        })),
        ...dayTasks.map(t => ({
          type: 'deadline',
          time: t.deadlineTime,
          title: `Tenggat: ${t.title}`,
          subtitle: `${t.priority} • ${t.completed ? 'Tuntas' : 'Belum Selesai'}`,
          category: t.category,
          completed: t.completed,
          id: t.id
        }))
      ].sort((a, b) => a.time.localeCompare(b.time));

      return `
        <div class="animate-ios-view grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- Calendar Card (Persian Navy Surface) -->
          <div class="lg:col-span-5 persian-hero-surface text-ivoryCard rounded-[28px] p-5 border border-antiqueGold/30 h-fit">
            <div class="flex items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-1.5">
                <button onclick="changeCalendarMonth(-1)" aria-label="Bulan Sebelumnya" class="ios-tap w-8 h-8 rounded-full bg-ivoryCard/10 hover:bg-ivoryCard/20 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <h2 class="text-sm font-bold px-1">${calMonthFullLabel}</h2>
                <button onclick="changeCalendarMonth(1)" aria-label="Bulan Berikutnya" class="ios-tap w-8 h-8 rounded-full bg-ivoryCard/10 hover:bg-ivoryCard/20 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>
              </div>
              <button onclick="openQuickAddModal('schedule')" class="ios-tap px-3.5 py-1.5 rounded-full bg-champagneGold text-persianNavy text-xs font-bold">
                + Jadwal
              </button>
            </div>

            <div class="grid grid-cols-7 text-center text-[10px] font-bold text-[#B8B0A2] mb-2">
              <span>SEN</span><span>SEL</span><span>RAB</span><span>KAM</span><span>JUM</span><span>SAB</span><span>MIN</span>
            </div>
            <div class="grid grid-cols-7 gap-y-1.5 text-center text-xs tabular-nums">
              ${renderCalendarGridDays()}
            </div>

            <div class="flex items-center justify-between text-[10px] text-[#C2BBB0] mt-4 pt-3 border-t border-ivoryCard/15">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-champagneGold"></span> Terpilih</span>
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border border-ivoryCard"></span> Hari Ini</span>
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-antiqueGold/60"></span> Terjadwal</span>
            </div>
          </div>

          <!-- Daily Timeline -->
          <div class="lg:col-span-7 bg-ivoryCard dark:bg-persianNavy/80 rounded-[28px] p-5 border border-desertStone/55 dark:border-persianIndigo">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="text-base font-bold text-inkCharcoal dark:text-ivoryCard">Agenda ${formatIndoDate(selDate)}</h3>
                <p class="text-xs text-[#6E695F] dark:text-stone-400">${daySchedules.length} kegiatan • ${dayTasks.length} tenggat tugas</p>
              </div>
              ${selDate !== TODAY_STR ? `
                <button onclick="selectCalendarDay('${TODAY_STR}')" class="ios-tap px-3 py-1 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-xs font-semibold">Hari Ini</button>
              ` : ''}
            </div>

            <div class="space-y-3">
              ${timeline.length === 0 ? `
                <div class="p-8 rounded-[22px] bg-parchmentCanvas/70 dark:bg-persianIndigo/50 text-center">
                  <p class="text-sm font-bold text-inkCharcoal dark:text-ivoryCard">Jadwal kosong</p>
                  <p class="text-xs text-[#6E695F] dark:text-stone-400 mt-1">Tidak ada bentrok kegiatan OSIS atau tenggat tugas.</p>
                </div>
              ` : timeline.map(item => {
                const cat = CATEGORY_META[item.category] || CATEGORY_META['Sekolah'];
                const isDeadline = item.type === 'deadline';
                return `
                  <div onclick="${isDeadline ? `openTaskDetailModal('${item.id}')` : ''}" class="flex gap-3 items-stretch ${isDeadline ? 'cursor-pointer' : ''}">
                    <div class="w-12 text-right pt-1 flex-shrink-0 tabular-nums">
                      <span class="text-xs font-bold text-inkCharcoal dark:text-ivoryCard">${item.time}</span>
                      <span class="block text-[10px] text-[#7D776D]">${item.endTime || 'Batas'}</span>
                    </div>
                    <div class="flex flex-col items-center">
                      <span class="w-2.5 h-2.5 rounded-full mt-1.5 ${isDeadline ? 'bg-terracotta ring-4 ring-terracotta/20' : cat.dotColor}"></span>
                      <span class="w-px flex-1 bg-desertStone/60 dark:bg-persianIndigo my-1"></span>
                    </div>
                    <div class="flex-1 p-3.5 rounded-[20px] bg-parchmentCanvas/75 dark:bg-persianIndigo/75 mb-1">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${cat.badge}">
                          ${cat.iconSvg}
                          <span>${item.category}</span>

    function renderCalendarGridDays() {
      const year = state.calendarYear;
      const month = state.calendarMonth;
      const firstDayJs = new Date(year, month, 1).getDay();
      const mondayOffset = (firstDayJs + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const scheduledDates = new Set([
        ...state.schedules.map(s => s.date),
        ...state.tasks.map(t => t.deadlineDate)
      ]);

      const recurringDows = new Set(
        state.schedules
          .filter(s => s.recurringWeekly)
          .map(s => {
            const [oy, om, od] = s.date.split('-').map(Number);
            return new Date(oy, om - 1, od).getDay();
          })
      );

      let cells = '';
      for (let e = 0; e < mondayOffset; e++) cells += `<span></span>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dow = new Date(year, month, day).getDay();
        const isSelected = dateStr === state.selectedCalendarDate;
        const isToday = dateStr === TODAY_STR;
        const hasEvent = scheduledDates.has(dateStr) || recurringDows.has(dow);

        let cls = 'ios-tap relative w-9 h-9 mx-auto rounded-full flex items-center justify-center transition ';
        if (isSelected) {
          cls += 'bg-champagneGold text-persianNavy font-bold shadow-sm';
        } else if (isToday) {
          cls += 'border border-champagneGold text-ivoryCard font-bold';
        } else {
          cls += 'text-[#D5CFC4] hover:bg-ivoryCard/10';
        }

        cells += `
          <button onclick="selectCalendarDay('${dateStr}')" class="${cls}">
            <span>${day}</span>
            ${hasEvent && !isSelected ? `<span class="w-1 h-1 rounded-full bg-champagneGold absolute bottom-1"></span>` : ''}
          </button>
        `;
      }
      return cells;
    }

    function computeWeeklyRecapStats() {
      const weekDates = new Set(getCurrentWeekDates());
      const weekTasks = state.tasks.filter(t => weekDates.has(t.deadlineDate) || t.completed);
      const completedAll = state.tasks.filter(t => t.completed);

      const sekolahTotal = weekTasks.filter(t => t.category === 'Sekolah').length;
      const sekolahDone = weekTasks.filter(t => t.category === 'Sekolah' && t.completed).length;

      const osisTotal = weekTasks.filter(t => t.category === 'OSIS').length;
      const osisDone = weekTasks.filter(t => t.category === 'OSIS' && t.completed).length;

      const otherTotal = weekTasks.filter(t => t.category === 'Project' || t.category === 'Rutin').length;
      const otherDone = weekTasks.filter(t => (t.category === 'Project' || t.category === 'Rutin') && t.completed).length;

      const totalCount = Math.max(weekTasks.length, 1);
      const doneCount = weekTasks.filter(t => t.completed).length;
      const completionRate = Math.round((doneCount / totalCount) * 100);

      const totalChapters = state.subjects.reduce((acc, s) => acc + s.chapters.length, 0);
      const masteredChapters = state.subjects.reduce((acc, s) => acc + s.chapters.filter(c => c.status === 'paham').length, 0);

      return {
        weekTotal: weekTasks.length,
        weekDone: doneCount,
        totalCompletedEver: completedAll.length,
        completionRate,
        sekolahTotal,
        sekolahDone,
        osisTotal,
        osisDone,
        otherTotal,
        otherDone,
        totalChapters,
        masteredChapters
      };
    }

    function handleProfilePhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Pilih file gambar dari galeri', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          // Compress & crop square thumbnail (160x160) so GitHub Gist sync stays ultra-fast
          const size = 160;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          pendingProfileAvatarData = canvas.toDataURL('image/jpeg', 0.78);
          const previewEl = document.getElementById('profile-preview-avatar');
          if (previewEl) {
            previewEl.innerHTML = `<img src="${pendingProfileAvatarData}" alt="Preview Foto" class="w-full h-full object-cover" />`;
          }
          showToast('Foto dipilih, ketuk Simpan Profil');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

      renderApp();
      markDataChanged();
    }

              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block text-xs font-semibold mb-1">Mulai</label>
                  <input id="edit-sch-start" type="time" required value="${sch.startTime}" class="w-full px-3 py-2.5 rounded-2xl bg-parchmentCanvas/70 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Selesai</label>
                  <input id="edit-sch-end" type="time" required value="${sch.endTime}" class="w-full px-3 py-2.5 rounded-2xl bg-parchmentCanvas/70 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Lokasi / Keterangan</label>
                <input id="edit-sch-loc" type="text" value="${escapeHtml(sch.location)}" class="w-full px-3.5 py-2.5 rounded-2xl bg-parchmentCanvas/70 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
              </div>
              <label class="flex items-center gap-2 text-xs font-semibold pt-1 cursor-pointer">
                <input id="edit-sch-recurring" type="checkbox" ${sch.recurringWeekly ? 'checked' : ''} class="rounded accent-persianNavy" />
                <span>Ulangi otomatis setiap minggu</span>
              </label>
              <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="ios-tap flex-1 py-3 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-xs font-bold">Batal</button>
                <button type="submit" class="ios-tap flex-[2] py-3 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">Simpan Perubahan</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function saveEditedSchedule(e, schId) {
      e.preventDefault();
      const sch = state.schedules.find(s => s.id === schId);
      if (!sch) return;
      sch.title = document.getElementById('edit-sch-title').value.trim();
      sch.category = document.getElementById('edit-sch-cat').value;
      sch.date = document.getElementById('edit-sch-date').value;
      sch.startTime = document.getElementById('edit-sch-start').value;
      sch.endTime = document.getElementById('edit-sch-end').value;
      sch.location = document.getElementById('edit-sch-loc').value.trim();
      sch.recurringWeekly = document.getElementById('edit-sch-recurring').checked;
      closeModal();
      renderApp();
      markDataChanged();
      showToast('Jadwal diperbarui');
    }

    /**
     * ============================================================================
     * SUBJECT DETAIL & CHAPTERS MODAL
     * ============================================================================
     */
    function openSubjectDetailModal(subId) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const root = document.getElementById('modal-root');

      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-persianNavy/55 backdrop-blur-xs flex items-end md:items-center justify-center animate-ios-backdrop p-0 md:p-4">
          <div class="w-full max-w-md bg-ivoryCard dark:bg-persianNavy rounded-t-[32px] md:rounded-[32px] p-5 shadow-2xl border border-desertStone/60 dark:border-persianIndigo max-h-[90vh] overflow-y-auto animate-ios-sheet">
            <div class="w-10 h-1 bg-desertStone dark:bg-persianIndigo rounded-full mx-auto mb-4 md:hidden"></div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <div>
                <h3 class="text-base font-bold text-inkCharcoal dark:text-ivoryCard">${escapeHtml(sub.name)}</h3>
                <p class="text-xs text-[#6E695F] dark:text-stone-400">${escapeHtml(sub.teacher)}</p>
              </div>
              <button onclick="deleteSubjectById('${sub.id}')" class="ios-tap px-3 py-1 rounded-full bg-[#F5E4E1] dark:bg-[#3A1E1B] text-terracotta text-xs font-semibold">Hapus Mapel</button>
            </div>

            <div class="space-y-2.5 my-4">
              ${sub.chapters.map(ch => `
                <div class="p-3 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/45 dark:border-persianIndigo space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <h4 class="text-xs font-bold text-inkCharcoal dark:text-ivoryCard">${escapeHtml(ch.title)}</h4>
                    <button onclick="deleteChapter('${sub.id}', '${ch.id}')" class="ios-tap text-xs text-[#8D867B] hover:text-terracotta">×</button>
                  </div>
                  ${ch.note ? `<p class="text-[11px] text-[#5C574E] dark:text-stone-300">${escapeHtml(ch.note)}</p>` : ''}
                  <div class="grid grid-cols-3 gap-1.5 pt-1">
                    ${[
                      { k: 'belum', l: 'Belum' },
                      { k: 'review', l: 'Review' },
                      { k: 'paham', l: 'Paham' }
                    ].map(st => `
                      <button onclick="setChapterStatus('${sub.id}', '${ch.id}', '${st.k}')" class="ios-tap py-1 rounded-xl text-[11px] font-bold ${ch.status === st.k ? 'bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy' : 'bg-ivoryCard dark:bg-persianNavy text-[#6E695F] dark:text-stone-400'}">
                        ${st.l}
                      </button>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>

            <form onsubmit="addChapterToSubject(event, '${sub.id}')" class="space-y-2 pt-2 border-t border-desertStone/40 dark:border-persianIndigo">
              <input id="new-chap-title" type="text" required placeholder="Tambah bab baru..." class="w-full px-3.5 py-2 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
              <input id="new-chap-note" type="text" placeholder="Catatan rumus / ringkasan..." class="w-full px-3.5 py-2 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
              <div class="flex gap-2">
                <button type="button" onclick="closeModal()" class="ios-tap flex-1 py-2.5 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-xs font-bold">Tutup</button>
                <button type="submit" class="ios-tap flex-[2] py-2.5 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">+ Tambah Bab</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * CLOUD SYNC (GITHUB GIST) & REMINDERS MODALS
     * ============================================================================
     */
    function openCloudSyncModal() {
      const root = document.getElementById('modal-root');
      const g = state.gist;
      const shareUrl = g.gistId ? `${window.location.origin}${window.location.pathname}?gist_id=${encodeURIComponent(g.gistId)}` : '';

      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-persianNavy/55 backdrop-blur-xs flex items-end md:items-center justify-center animate-ios-backdrop p-0 md:p-4">
          <div class="w-full max-w-md bg-ivoryCard dark:bg-persianNavy rounded-t-[32px] md:rounded-[32px] p-5 shadow-2xl border border-desertStone/60 dark:border-persianIndigo max-h-[90vh] overflow-y-auto animate-ios-sheet">
            <div class="w-10 h-1 bg-desertStone dark:bg-persianIndigo rounded-full mx-auto mb-4 md:hidden"></div>

            <div class="flex items-center justify-between mb-2">
              <h3 class="text-base font-bold text-inkCharcoal dark:text-ivoryCard">Sinkronisasi Cloud (GitHub Gist)</h3>
              <button onclick="closeModal()" class="ios-tap text-xs font-semibold text-[#6E695F] dark:text-stone-400">Tutup</button>
            </div>
            <p class="text-xs text-[#6E695F] dark:text-stone-400 mb-3">
              Data profil, foto, tugas, dan jadwal tersimpan langsung ke Secret Gist GitHub milikmu.
            </p>

            ${g.lastError ? `
              <div class="p-3 rounded-2xl bg-[#F5E4E1] dark:bg-[#3A1E1B] text-terracotta dark:text-[#F09A8E] text-xs font-semibold mb-3">
                ${escapeHtml(g.lastError)}
              </div>
            ` : ''}

            <form onsubmit="event.preventDefault(); saveGistCredentials(); syncPushToGist(true);" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold mb-1">Personal Access Token (scope: gist)</label>
                <input id="gist-token-input" name="password" type="password" autocomplete="current-password" value="${escapeHtml(g.token)}" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3.5 py-2.5 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1">Gist ID (Kosongkan untuk buat Gist baru)</label>
                <input id="gist-id-input" type="text" value="${escapeHtml(g.gistId)}" placeholder="Otomatis terisi setelah simpan pertama" class="w-full px-3.5 py-2.5 rounded-2xl bg-parchmentCanvas/75 dark:bg-[#0B1424] border border-desertStone/60 dark:border-persianIndigo text-xs" />
              </div>

              <label class="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                <input id="gist-autosync-input" type="checkbox" ${g.autoSync ? 'checked' : ''} onchange="saveGistCredentials()" class="rounded accent-persianNavy" />
                <span>Simpan otomatis ke Gist setiap ada perubahan</span>
              </label>

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button type="button" onclick="saveGistCredentials(); syncPullFromGist(true);" class="ios-tap py-3 rounded-full bg-parchmentCanvas dark:bg-persianIndigo text-xs font-bold">Muat dari Gist</button>
                <button type="submit" class="ios-tap py-3 rounded-full bg-persianNavy dark:bg-champagneGold text-ivoryCard dark:text-persianNavy text-xs font-bold">Simpan ke Gist</button>
              </div>
            </form>

            ${shareUrl ? `
              <div class="mt-4 pt-3 border-t border-desertStone/45 dark:border-persianIndigo">
                <p class="text-[11px] font-semibold text-[#6E695F] dark:text-stone-400 mb-1.5">Link Bookmark HP (Gist ID otomatis terpasang):</p>
                <button onclick="copyBookmarkLink('${escapeHtml(shareUrl)}')" class="ios-tap w-full py-2.5 px-3 rounded-2xl bg-parchmentCanvas dark:bg-[#0B1424] border border-desertStone/50 dark:border-persianIndigo text-xs font-bold text-persianNavy dark:text-champagneGold">
                  Salin Link Bookmark
                </button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function saveGistCredentials() {
      const tokenEl = document.getElementById('gist-token-input');
      const idEl = document.getElementById('gist-id-input');
      const autoEl = document.getElementById('gist-autosync-input');
      if (tokenEl) state.gist.token = tokenEl.value.trim();
      if (idEl) state.gist.gistId = idEl.value.trim();
      if (autoEl) state.gist.autoSync = autoEl.checked;
    }

    function copyBookmarkLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast('Link bookmark disalin'));
      } else {
        showToast('Salin URL dari address bar browser');
      }
    }

    function openRemindersModal() {
      const upcoming = state.tasks
        .filter(t => !t.completed)
        .sort((a, b) => a.deadlineDate.localeCompare(b.deadlineDate));
      const root = document.getElementById('modal-root');

      root.innerHTML = `
        <div onclick="if(event.target === this) closeModal()" class="fixed inset-0 z-40 bg-persianNavy/55 backdrop-blur-xs flex items-end md:items-center justify-center animate-ios-backdrop p-0 md:p-4">
          <div class="w-full max-w-md bg-ivoryCard dark:bg-persianNavy rounded-t-[32px] md:rounded-[32px] p-5 shadow-2xl border border-desertStone/60 dark:border-persianIndigo max-h-[85vh] overflow-y-auto animate-ios-sheet">
            <div class="w-10 h-1 bg-desertStone dark:bg-persianIndigo rounded-full mx-auto mb-4 md:hidden"></div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-base font-bold">Pengingat Tenggat Aktif</h3>
              <button onclick="closeModal()" class="ios-tap text-xs font-semibold text-[#6E695F] dark:text-stone-400">Tutup</button>
            </div>
            <div class="space-y-2">
              ${upcoming.length === 0 ? `
                <p class="text-xs text-[#6E695F] dark:text-stone-400 py-4 text-center">Tidak ada tenggat aktif.</p>
              ` : upcoming.map(t => `
                <div onclick="openTaskDetailModal('${t.id}')" class="ios-tap p-3 rounded-2xl bg-parchmentCanvas/75 dark:bg-persianIndigo/70 flex items-center justify-between gap-2 cursor-pointer">
                  <div class="min-w-0">
                    <h4 class="text-xs font-bold truncate">${escapeHtml(t.title)}</h4>
                    <p class="text-[11px] text-[#6E695F] dark:text-stone-400 tabular-nums">${formatIndoDate(t.deadlineDate)} • ${t.deadlineTime}</p>
                  </div>
                  <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full ${(PRIORITY_META[t.priority] || PRIORITY_META['Sedang']).badge}">${t.priority}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * STATE MUTATIONS & EVENT HANDLERS
     * ============================================================================
     */
    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function toggleTaskDone(taskId, e) {
      if (e) e.stopPropagation();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.completed = !task.completed;
      renderApp();
      markDataChanged();
      showToast(task.completed ? 'Tugas selesai' : 'Tugas dikembalikan ke aktif');
    }

    function toggleSubtaskDone(taskId, subId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const sub = task.subtasks.find(s => s.id === subId);
      if (sub) sub.done = !sub.done;
      openTaskDetailModal(taskId);
      renderApp();
      markDataChanged();
    }

    function deleteSubtask(taskId, subId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.subtasks = task.subtasks.filter(s => s.id !== subId);
      openTaskDetailModal(taskId);
      renderApp();
      markDataChanged();
    }

    function addSubtask(e, taskId) {
      e.preventDefault();
      const input = document.getElementById('new-subtask-input');
      const val = input.value.trim();
      if (!val) return;
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.subtasks.push({ id: generateId('sub'), text: val, done: false });
      openTaskDetailModal(taskId);
      renderApp();
      markDataChanged();
    }

    function deleteTaskById(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      closeModal();
      renderApp();
      markDataChanged();
      showToast('Tugas dihapus');
    }

    function deleteScheduleById(schId) {
      state.schedules = state.schedules.filter(s => s.id !== schId);
      renderApp();
      markDataChanged();
      showToast('Jadwal dihapus');
    }

    function submitQuickTask(e) {
      e.preventDefault();
      const title = document.getElementById('qa-task-title').value.trim();
      if (!title) return;
      const subRaw = document.getElementById('qa-task-sub').value.trim();
      const subtasks = subRaw
        ? subRaw.split(',').map(s => s.trim()).filter(Boolean).map(text => ({ id: generateId('s'), text, done: false }))
        : [];

      state.tasks.unshift({
        id: generateId('t'),
        title,
        category: document.getElementById('qa-task-cat').value,
        priority: document.getElementById('qa-task-prio').value,
        deadlineDate: document.getElementById('qa-task-date').value,
        deadlineTime: document.getElementById('qa-task-time').value,
        reminder: '1 jam sebelum',
        notes: document.getElementById('qa-task-notes').value.trim(),
        completed: false,
        subtasks
      });

      closeModal();
      renderApp();
      markDataChanged();
      showToast('Tugas ditambahkan');
    }

    function submitQuickSchedule(e) {
      e.preventDefault();
      const title = document.getElementById('qa-sch-title').value.trim();
      if (!title) return;
      const date = document.getElementById('qa-sch-date').value;

      state.schedules.push({
        id: generateId('sch'),
        title,
        category: document.getElementById('qa-sch-cat').value,
        date,
        startTime: document.getElementById('qa-sch-start').value,
        endTime: document.getElementById('qa-sch-end').value,
        location: document.getElementById('qa-sch-loc').value.trim() || 'Terjadwal',
        recurringWeekly: document.getElementById('qa-sch-recurring').checked
      });

      state.selectedCalendarDate = date;
      closeModal();
      renderApp();
      markDataChanged();
      showToast('Jadwal disimpan');
    }

    function submitQuickLesson(e) {
      e.preventDefault();
      const name = document.getElementById('qa-les-name').value.trim();
      const chapterTitle = document.getElementById('qa-les-chapter').value.trim();
      if (!name || !chapterTitle) return;

      const existing = state.subjects.find(s => s.name.toLowerCase() === name.toLowerCase());
      const newChapter = {
        id: generateId('ch'),
        title: chapterTitle,
        status: 'belum',
        note: document.getElementById('qa-les-note').value.trim()
      };

      if (existing) {
        existing.chapters.push(newChapter);
      } else {
        state.subjects.push({
          id: generateId('sub'),
          name,
          teacher: document.getElementById('qa-les-teacher').value.trim() || 'Mata Pelajaran',
          iconKey: document.getElementById('qa-les-icon').value,
          chapters: [newChapter]
        });
      }

      closeModal();
      renderApp();
      markDataChanged();
      showToast('Materi ditambahkan');
    }

    function setChapterStatus(subId, chapId, status) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const ch = sub.chapters.find(c => c.id === chapId);
      if (ch) ch.status = status;
      openSubjectDetailModal(subId);
      renderApp();
      markDataChanged();
    }

    function deleteChapter(subId, chapId) {
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      sub.chapters = sub.chapters.filter(c => c.id !== chapId);
      openSubjectDetailModal(subId);
      renderApp();
      markDataChanged();
    }

    function deleteSubjectById(subId) {
      state.subjects = state.subjects.filter(s => s.id !== subId);
      closeModal();
      renderApp();
      markDataChanged();
      showToast('Mata pelajaran dihapus');
    }

    function addChapterToSubject(e, subId) {
      e.preventDefault();
      const sub = state.subjects.find(s => s.id === subId);
      if (!sub) return;
      const title = document.getElementById('new-chap-title').value.trim();
      if (!title) return;
      sub.chapters.push({
        id: generateId('ch'),
        title,
        status: 'belum',
        note: document.getElementById('new-chap-note').value.trim()
      });
      openSubjectDetailModal(subId);
      renderApp();
      markDataChanged();
    }

    function selectCalendarDay(dateStr) {
      state.selectedCalendarDate = dateStr;
      const parts = dateStr.split('-').map(Number);
      if (parts.length === 3) {
        state.calendarYear = parts[0];
        state.calendarMonth = parts[1] - 1;
      }
      renderApp();
    }

    function changeCalendarMonth(delta) {
      let m = state.calendarMonth + delta;
      let y = state.calendarYear;
      if (m < 0) {
        m = 11;
        y -= 1;
      } else if (m > 11) {
        m = 0;
        y += 1;
      }
      state.calendarMonth = m;
      state.calendarYear = y;
      renderApp();
    }

    /**
     * ============================================================================
     * ROOT RENDERER & BOOTSTRAP
     * ============================================================================
     */
    function renderApp() {
      updateHeaderIdentity();
      const container = document.getElementById('main-content');
      if (!container) return;

      if (state.currentTab === 'today') {
        container.innerHTML = renderDashboardTab();
      } else if (state.currentTab === 'tasks') {
        container.innerHTML = renderTasksTab();
      } else if (state.currentTab === 'calendar') {
        container.innerHTML = renderCalendarTab();
      } else if (state.currentTab === 'lessons') {
        container.innerHTML = renderLessonsTab();
      }

      const urgentActive = state.tasks.filter(t => !t.completed && t.priority === 'Tinggi').length;
      const badge = document.getElementById('bell-badge');
      if (badge) {
        badge.style.display = urgentActive > 0 ? 'block' : 'none';
      }
    }

    // Initialize App
    renderApp();
    requestAnimationFrame(positionMobileNavGlider);
    if (state.gist.gistId) {
      syncPullFromGist(false);
    }
  </script>
</body>
</html>
